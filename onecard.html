<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업무 카드 전달 — BOARD 24</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#1B1D2A">
<link rel="stylesheet" href="assets/app.css">
<style>
/* ---------- ONE CARD 전용 ---------- */
.onecard-stage {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: min(1040px, 100%);
  margin: 0 auto;
  padding: 8px 0 28px;
}
.oc-status {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.oc-status > span {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: #657084;
  font-family: var(--f-mono);
  font-size: 11px;
  text-align: center;
}
.oc-status b {
  display: block;
  overflow: hidden;
  margin-top: 3px;
  color: #202633;
  font-family: var(--f-sans);
  font-size: 15px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.oc-opponents {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.oc-player {
  position: relative;
  min-height: 88px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.oc-player.active {
  border-color: #3971e7;
  background: #edf4ff;
  box-shadow: 0 0 0 1px #3971e7 inset;
}
.oc-player.dead { opacity: .58; }
.oc-player-head { display: flex; align-items: center; gap: 9px; }
.oc-player-head .avatar { flex: 0 0 auto; }
.oc-player-name { min-width: 0; flex: 1; }
.oc-player-name b { display: block; overflow: hidden; color: #202633; text-overflow: ellipsis; white-space: nowrap; }
.oc-player-name small { display: block; margin-top: 2px; color: #727d90; }
.oc-count {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 999px;
  background: #edf1f7;
  color: #263148;
  font-family: var(--f-mono);
  font-size: 11px;
}
.oc-backs { display: flex; align-items: center; margin-top: 9px; padding-left: 7px; }
.oc-back-mini {
  width: 29px;
  height: 40px;
  margin-left: -7px;
  border: 2px solid #fff;
  border-radius: 4px;
  background: repeating-linear-gradient(135deg, #1f3156 0 5px, #304a7c 5px 10px);
  box-shadow: 0 1px 3px rgba(31,49,86,.2);
}
.oc-table {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 22px;
  min-height: 250px;
  padding: 24px;
  border: 1px solid #d7dfea;
  border-radius: 16px;
  background: radial-gradient(circle at 50% 42%, #f8fbff 0, #edf2f8 58%, #e6edf6 100%);
}
.oc-pile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: #657084;
  font-family: var(--f-mono);
  font-size: 11px;
  text-align: center;
}
.oc-deck {
  position: relative;
  width: 112px;
  height: 156px;
  border: 4px solid #fff;
  border-radius: 11px;
  background: repeating-linear-gradient(135deg, #17284a 0 8px, #2f4d82 8px 16px);
  box-shadow: 4px 4px 0 #cbd5e3, 8px 8px 0 #b8c5d7, 0 16px 30px rgba(30,49,83,.2);
}
.oc-deck::after {
  content: 'B24';
  position: absolute;
  inset: 16px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.45);
  color: #fff;
  font-family: var(--f-display);
  font-size: 25px;
  letter-spacing: .06em;
}
.oc-card {
  position: relative;
  width: 118px;
  height: 164px;
  flex: 0 0 auto;
  border: 1px solid #bfc9d8;
  border-radius: 11px;
  background: #fff;
  color: #222a39;
  box-shadow: 0 8px 18px rgba(29,42,67,.16);
  user-select: none;
}
button.oc-card {
  appearance: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
  transition: transform .14s ease, box-shadow .14s ease, opacity .14s ease;
}
button.oc-card:not(:disabled):hover,
button.oc-card:not(:disabled):focus-visible {
  z-index: 3;
  transform: translateY(-12px);
  box-shadow: 0 16px 28px rgba(29,42,67,.24);
}
button.oc-card:disabled { cursor: default; opacity: .55; }
button.oc-card.playable { border-color: #3971e7; box-shadow: 0 0 0 2px rgba(57,113,231,.16), 0 8px 18px rgba(29,42,67,.16); }
.oc-card.red { color: #d23b42; }
.oc-card.black { color: #202633; }
.oc-card.joker-black { color: #202633; background: linear-gradient(150deg,#fff,#e8edf5); }
.oc-card.joker-color { color: #fff; background: linear-gradient(145deg,#e84b4b,#f2b33d 34%,#3f9e68 67%,#3971e7); }
.oc-card-corner {
  position: absolute;
  top: 8px;
  left: 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--f-display);
  font-size: 19px;
  font-weight: 600;
  line-height: .95;
}
.oc-card-corner.bottom { top: auto; left: auto; right: 9px; bottom: 8px; transform: rotate(180deg); }
.oc-card-suit { font-size: 17px; }
.oc-card-center {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 54px;
  font-weight: 600;
}
.oc-card-center.joker { padding: 24px 10px; font-size: 18px; letter-spacing: .12em; writing-mode: vertical-rl; }
.oc-card-effect {
  position: absolute;
  left: 50%;
  bottom: 19px;
  transform: translateX(-50%);
  padding: 3px 6px;
  border-radius: 999px;
  background: rgba(31,49,86,.09);
  color: inherit;
  font-family: var(--f-mono);
  font-size: 9px;
  white-space: nowrap;
}
.oc-card.joker-color .oc-card-effect { background: rgba(255,255,255,.2); }
.oc-center-info { min-width: 150px; text-align: center; }
.oc-turn {
  margin-bottom: 9px;
  color: #1e2b43;
  font-size: 15px;
  font-weight: 700;
}
.oc-suit-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 78px;
  padding: 7px 10px;
  border-radius: 999px;
  background: #fff;
  color: #202633;
  box-shadow: 0 4px 12px rgba(31,49,86,.11);
  font-size: 14px;
  font-weight: 700;
}
.oc-suit-chip.red { color: #d23b42; }
.oc-attack {
  margin-top: 9px;
  padding: 6px 9px;
  border-radius: 7px;
  background: #fff1f1;
  color: #b82e36;
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 700;
}
.oc-actions { display: flex; justify-content: center; gap: 8px; }
.oc-actions .btn { min-width: 150px; }
.oc-message {
  min-height: 22px;
  color: #5d687b;
  font-size: 13px;
  text-align: center;
}
.oc-hand-wrap {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}
.oc-hand-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 11px; }
.oc-hand-head b { color: #202633; }
.oc-hand-head span { color: #6d788b; font-family: var(--f-mono); font-size: 11px; }
.oc-hand {
  display: flex;
  justify-content: flex-start;
  gap: 8px;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 14px 10px 18px;
  scroll-snap-type: x proximity;
  overscroll-behavior-x: contain;
  touch-action: pan-x;
  scrollbar-gutter: stable;
  -webkit-overflow-scrolling: touch;
}
.oc-hand .oc-card {
  flex: 0 0 auto;
  scroll-snap-align: center;
}
.oc-rule-note {
  color: #697488;
  font-size: 12px;
  line-height: 1.65;
  text-align: center;
}
.oc-choice-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(16,24,39,.56);
}
.oc-choice {
  width: min(390px, 100%);
  padding: 22px;
  border-radius: 16px;
  background: #fff;
  color: #202633;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.oc-choice h3 { margin: 0 0 7px; }
.oc-choice p { margin: 0 0 16px; color: #687386; font-size: 13px; }
.oc-suit-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.oc-suit-buttons button {
  min-height: 58px;
  border: 1px solid #d6deea;
  border-radius: 10px;
  background: #f6f8fb;
  color: #202633;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}
.oc-suit-buttons button.red { color: #d23b42; }
.oc-choice-cancel { width: 100%; margin-top: 9px; }

/* 로비 */
.lobby { max-width: 650px; margin: 30px auto; }
.lobby h2 { font-family: var(--f-display); font-size: 34px; margin: 0 0 4px; font-weight: 400; }
.lobby-players { display: flex; flex-direction: column; gap: 7px; margin: 22px 0; }
.lobby-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--ink-2);
}
.lobby-row .badge {
  font-family: var(--f-mono); font-size: 10.5px;
  padding: 2px 6px; border-radius: 2px;
  background: var(--ink-3); color: var(--cream-dim);
}
.lobby-row .badge.ready { background: var(--green); color: #fff; }
.lobby-row .badge.host { background: var(--brass); color: var(--ink); }
.result-podium { display: grid; gap: 8px; margin: 22px 0; }
.result-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: #202633;
}
.result-row.win { border-color: #3971e7; background: #edf4ff; }
.result-rank { width: 30px; font-family: var(--f-mono); font-weight: 700; }
.result-row .result-name { flex: 1; font-weight: 700; }
.result-row small { color: #6c7789; }

@media (max-width: 860px) {
  .onecard-stage { gap: 8px; padding: 0 0 8px; }
  .oc-status { grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .oc-status > span { padding: 6px 4px; font-size: 7px; }
  .oc-status > span:nth-child(4), .oc-status > span:nth-child(5) { display: none; }
  .oc-status b { margin-top: 1px; font-size: 9px; }
  .oc-opponents { gap: 4px; }
  .oc-player { min-height: 58px; padding: 6px; border-radius: 7px; }
  .oc-player-head { gap: 5px; }
  .oc-player-head .avatar { width: 25px; height: 25px; font-size: 8px; }
  .oc-player-name b { font-size: 9px; }
  .oc-player-name small { font-size: 6.5px; }
  .oc-count { padding: 2px 4px; font-size: 7px; }
  .oc-backs { display: none; }
  .oc-table { grid-template-columns: 1fr auto 1fr; gap: 7px; min-height: 126px; padding: 10px 6px; border-radius: 10px; }
  .oc-deck { width: 58px; height: 81px; border-width: 2px; border-radius: 6px; box-shadow: 2px 2px 0 #cbd5e3, 4px 4px 0 #b8c5d7; }
  .oc-deck::after { inset: 7px; font-size: 13px; }
  .oc-card { width: 62px; height: 86px; border-radius: 6px; }
  .oc-card-corner { top: 4px; left: 5px; font-size: 10px; }
  .oc-card-corner.bottom { right: 5px; bottom: 4px; }
  .oc-card-suit { font-size: 9px; }
  .oc-card-center { font-size: 28px; }
  .oc-card-center.joker { padding: 10px 4px; font-size: 9px; }
  .oc-card-effect { bottom: 8px; padding: 1px 3px; font-size: 5.5px; }
  .oc-pile { gap: 3px; font-size: 6.5px; }
  .oc-center-info { min-width: 86px; }
  .oc-turn { margin-bottom: 4px; font-size: 9px; }
  .oc-suit-chip { min-width: 48px; padding: 3px 5px; font-size: 8px; }
  .oc-attack { margin-top: 4px; padding: 3px 5px; font-size: 7px; }
  .oc-message { min-height: 16px; padding: 2px 6px; font-size: 8px; }
  .oc-actions {
    position: sticky;
    bottom: -8px;
    z-index: 12;
    width: 100%;
    padding: 7px;
    border: 1px solid #d8e0eb;
    border-radius: 9px;
    background: rgba(255,255,255,.97);
    box-shadow: 0 -5px 16px rgba(31,49,86,.10);
  }
  .oc-actions .btn { width: 100%; min-width: 0; min-height: 42px; padding: 7px; font-size: 10px; }
  .oc-hand-wrap { padding: 7px 3px; border-radius: 8px; }
  .oc-hand-head { padding: 0 5px; margin-bottom: 2px; }
  .oc-hand-head b { font-size: 9px; }
  .oc-hand-head span { font-size: 7px; }
  .oc-hand { justify-content: flex-start; gap: 3px; padding: 10px 7px 13px; }
  button.oc-card:not(:disabled):hover, button.oc-card:not(:disabled):focus-visible { transform: translateY(-5px); }
  .oc-rule-note { display: none; }
}

/* 공통 로비 초대 및 차례 순서 표시 */
.invite-panel { margin-top:14px; padding:13px; border:1px solid var(--line); border-radius:9px; background:#f8faff; }
.invite-panel-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
.invite-panel-head b { color:#202633; font-size:13px; }
.invite-panel-head small { color:#778398; font-size:10px; }
.invite-people { display:flex; flex-direction:column; gap:6px; }
.invite-person { display:flex; align-items:center; gap:8px; padding:8px 9px; border:1px solid #dce4ef; border-radius:7px; background:#fff; }
.invite-person .person-info { min-width:0; flex:1; }
.invite-person .person-info b { display:block; overflow:hidden; color:#263148; font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
.invite-person .person-info small { display:block; margin-top:1px; color:#7a8597; font-size:10px; }
.invite-person button { min-width:62px; padding:6px 9px; font-size:10.5px; }
.invite-empty { padding:10px; color:#7a8597; font-size:11px; text-align:center; }
.turn-sequence { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:0 0 10px; }
.turn-sequence > div { min-width:0; padding:9px 10px; border:1px solid #d8e0eb; border-radius:8px; background:#fff; text-align:center; }
.turn-sequence span { display:block; color:#7a8597; font-size:10px; }
.turn-sequence b { display:block; overflow:hidden; margin-top:3px; color:#263148; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
.turn-sequence .current { border-color:#3971e7; background:#eef4ff; box-shadow:0 0 0 1px #3971e7 inset; }
.turn-sequence .current b { color:#2859bd; }
@media (max-width:560px){ .turn-sequence{gap:4px}.turn-sequence>div{padding:7px 5px}.turn-sequence b{font-size:11px}.turn-sequence span{font-size:8.5px} }


/* v2.9.47 — 방장 참가자 내보내기 버튼을 X 아이콘으로 표시 */
.lobby-remove {
  display: inline-grid !important;
  place-items: center !important;
  width: 26px !important;
  min-width: 26px !important;
  height: 26px !important;
  padding: 0 !important;
  border-radius: 50% !important;
  font-size: 17px !important;
  line-height: 1 !important;
  font-weight: 500 !important;
}


/* v2.9.109 — 원카드 공통 UI 정리 */
.game-topbar [data-leave] { color: inherit !important; }
.oc-message, .lobby-description, .turn-sequence b, .oc-player-name b,
.side-pane, .chat-input input { overflow-wrap: anywhere; word-break: keep-all; }
@media (max-width: 860px) {
  .game-topbar { gap: 4px !important; }
  .game-topbar .gt-brand-mark { flex: 0 0 auto; }
  .game-topbar > div:not(.spacer) { min-width: 0; }
  .game-topbar .gt-title, .game-topbar .gt-room { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-topbar .header-action { min-width: 34px !important; padding-inline: 6px !important; }
  .game-topbar .header-label { display: none !important; }
  body[data-game-phase="lobby"] .side-tabs { display: none !important; }
  body[data-game-phase="lobby"] #logPane { display: none !important; }
  body[data-game-phase="lobby"] #chatPane { display: block !important; }
  .oc-opponents { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
  .oc-player { min-width: 0 !important; }
  .oc-player-head { align-items: flex-start !important; }
  .oc-player-name b { white-space: normal !important; line-height: 1.2; }
  .oc-player-head .avatar, .oc-count { display: none !important; }
  .oc-hand { flex-wrap: nowrap !important; overflow-x: auto !important; overflow-y: hidden !important; }
  .oc-choice { max-height: calc(100dvh - 36px); overflow-y: auto; }
}

</style>
</head>

<script>
/* ==========================================================
   ONE CARD — BOARD 24 통일 규칙
   - 2~5인, 54장(일반 52장 + 조커 2장), 각자 7장
   - 현재 카드와 같은 문양 또는 같은 숫자/문자를 낸다.
   - 2(+2), A(+3), 흑백 조커(+5), 컬러 조커(+7)는 공격 카드.
     공격 중에는 공격 카드만 이어서 낼 수 있고, 못 내면 누적 수만큼 받는다.
   - J: 다음 사람 건너뛰기 / Q: 방향 반전 / K: 한 번 더 / 7: 문양 변경
   - 흑백 조커는 현재 문양이 스페이드/클로버일 때만 낼 수 있다. 컬러 조커와 7은 문양을 선택한다.
   - 낼 카드가 없으면 한 장 받고 차례가 넘어간다.
   - 손패를 먼저 모두 없애면 승리한다.
   ========================================================== */
(async function () {

  const mod = (n, m) => ((n % m) + m) % m;

  function parseCard(code) {
    if (code === 'JB') return { code, joker: true, color: false, label: 'JOKER', attack: 5 };
    if (code === 'JC') return { code, joker: true, color: true, label: 'JOKER', attack: 7 };
    const suit = code.charAt(0);
    const rank = code.slice(1);
    return { code, suit, rank, joker: false, attack: rank === '2' ? 2 : rank === 'A' ? 3 : 0 };
  }

  function buildDeck(seed) {
    const deck = [];
    SUITS.forEach((s) => RANKS.forEach((r) => deck.push(s + r)));
    deck.push('JB', 'JC');
    return Core.shuffle(deck, Core.mulberry32(seed));
  }

  function isAttack(code) { return parseCard(code).attack > 0; }

  // 공격 우선순위: 2 < A < 흑백 조커 < 컬러 조커
  function attackLevel(code) {
    const c = parseCard(code);
    if (c.joker) return c.color ? 4 : 3;
    if (c.rank === 'A') return 2;
    if (c.rank === '2') return 1;
    return 0;
  }

  function isBlackSuit(suit) {
    return suit === 'S' || suit === 'C';
  }

  function jokerColorAllowed(code, r) {
    const c = parseCard(code);
    // 흑백 조커는 현재 적용 문양이 스페이드/클로버일 때만 낼 수 있다.
    if (c.joker && !c.color) return isBlackSuit(r.currentSuit);
    return true;
  }

  function canDefendAttack(code, r) {
    if (!isAttack(code) || !jokerColorAllowed(code, r)) return false;
    return attackLevel(code) >= Number(r.attackLevel || 1);
  }

  function needsSuit(code) {
    const c = parseCard(code);
    return c.joker || c.rank === '7';
  }

  function isPlayable(code, r) {
    const c = parseCard(code);
    if ((r.attack || 0) > 0) return canDefendAttack(code, r);
    if (!jokerColorAllowed(code, r)) return false;
    if (c.joker || c.rank === '7') return true;
    const top = parseCard(topCard(r));
    return c.suit === r.currentSuit || (!top.joker && c.rank === top.rank);
  }

  function cardEffectLabel(code) {
    const c = parseCard(code);
    if (c.joker) return c.color ? '+7 공격' : '+5 공격';
    return EFFECT[c.rank] || '';
  }

  function cardHtml(code, opts = {}) {
    const c = parseCard(code);
    const disabled = !!opts.disabled;
    const playable = !!opts.playable;
    const tag = opts.button ? 'button' : 'div';
    const classes = ['oc-card'];
    if (c.joker) classes.push(c.color ? 'joker-color' : 'joker-black');
    else classes.push(SUIT_META[c.suit].red ? 'red' : 'black');
    if (playable) classes.push('playable');
    const attrs = opts.button
      ? `type="button" data-card="${code}" ${disabled ? 'disabled' : ''} aria-label="${cardAria(code)}"`
      : `aria-label="${cardAria(code)}"`;
    if (c.joker) {
      return `<${tag} class="${classes.join(' ')}" ${attrs}>
        <span class="oc-card-corner">★</span>

    const m = SUIT_META[c.suit];
    return `<${tag} class="${classes.join(' ')}" ${attrs}>
      <span class="oc-card-corner"><b>${c.rank}</b><span class="oc-card-suit">${m.symbol}</span></span>

      ${cardEffectLabel(code) ? `<span class="oc-card-effect">${cardEffectLabel(code)}</span>` : ''}
    </${tag}>`;
  }

  function cardAria(code) {
    const c = parseCard(code);
    if (c.joker) return c.color ? '컬러 조커, 7장 공격' : '흑백 조커, 5장 공격';
    return `${SUIT_META[c.suit].name} ${c.rank}${cardEffectLabel(code) ? ', ' + cardEffectLabel(code) : ''}`;
  }

  function nextTurnIndex(r, steps = 1) {
    const ps = seatedList(r);
    return mod((r.turn || 0) + (r.direction || 1) * steps, ps.length);
  }

  function shufflePlain(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function refillDeck(r) {
    if ((r.deck || []).length > 0) return;
    const top = topCard(r);
    const pool = (r.discard || []).slice(0, -1);
    if (!pool.length) return;
    r.deck = shufflePlain(pool);
    r.discard = [top];
    r.shuffleCount = (r.shuffleCount || 0) + 1;
  }

  function drawCards(r, player, count) {
    player.hand = player.hand || [];
    let drawn = 0;
    for (let i = 0; i < count; i++) {
      refillDeck(r);
      if (!r.deck || !r.deck.length) break;
      player.hand.push(r.deck.pop());
      drawn++;
    }
    return drawn;
  }

  function chooseBestSuit(hand) {
    const counts = { S: 0, H: 0, D: 0, C: 0 };
    (hand || []).forEach((code) => {
      const c = parseCard(code);
      if (!c.joker) counts[c.suit]++;
    });
    return SUITS.slice().sort((a, b) => counts[b] - counts[a])[0] || 'S';
  }

  async function startGame() {
    if (actionBusy) return;
    actionBusy = true;
    try {
      let started = false;
      await Core.updateRoom(roomId, (r) => {
        const ps = seatedList(r);
        if (ps.length < 2 || ps.length > 5 || ps.some((p) => !p.ready)) return false;
        const deck = buildDeck(r.seed || Math.floor(Math.random() * 2147483647));
        ps.forEach((p) => {
          p.hand = [];
          p.ready = false;
          for (let i = 0; i < 7; i++) p.hand.push(deck.pop());
        });
        let starterIndex = deck.findIndex((code) => {
          const c = parseCard(code);
          return !c.joker && !['A', '2', '7', 'J', 'Q', 'K'].includes(c.rank);
        });
        if (starterIndex < 0) starterIndex = deck.length - 1;
        const starter = deck.splice(starterIndex, 1)[0];
        r.phase = 'playing';
        r.deck = deck;
        r.discard = [starter];
        r.currentSuit = parseCard(starter).suit;
        r.attack = 0;
        r.attackLevel = 0;
        r.direction = 1;
        r.turn = 0;
        r.winner = null;
        r.oneCardPlayer = null;
        r.oneCardDeclared = {};
        r.shuffleCount = 0;
        r.startedAt = Core.now();
        r.lastAction = '게임 시작';
        started = true;
      });
      if (started) {
        Core.sys(roomId, '원카드 세션이 시작되었습니다.');
        Core.log(roomId, '<b>세션 시작</b> · 각자 카드 7장');
      }
    } finally {
      actionBusy = false;
    }
  }

  async function playCard(code, chosenSuit = null, declared = false) {
    if (actionBusy) return;
    actionBusy = true;
    choiceCard = null;
    declareArmed = false;
    let logText = null;
    try {
      await Core.updateRoom(roomId, (r) => {
        if (r.phase !== 'playing') return false;
        const ps = seatedList(r);
        const cur = ps[mod(r.turn || 0, ps.length)];
        if (!cur || cur.id !== Core.me.id) return false;
        const p = r.players[Core.me.id];
        p.hand = p.hand || [];
        const at = p.hand.indexOf(code);
        if (at < 0 || !isPlayable(code, r)) return false;
        if (needsSuit(code) && !SUITS.includes(chosenSuit)) return false;

        const c = parseCard(code);
        const willHaveOne = p.hand.length === 2;
        p.hand.splice(at, 1);
        r.oneCardDeclared = r.oneCardDeclared || {};
        if (willHaveOne) {
          if (declared) {
            r.oneCardDeclared[p.id] = true;
          } else {
            const penalty = drawCards(r, p, 2);
            r.oneCardDeclared[p.id] = false;
            r.lastAction = `${p.name}: 원카드 미선언 벌칙 ${penalty}장`;
          }
        } else if (p.hand.length !== 1) {
          delete r.oneCardDeclared[p.id];
        }
        r.discard = r.discard || [];
        r.discard.push(code);
        if (c.joker || c.rank === '7') r.currentSuit = chosenSuit;
        else r.currentSuit = c.suit;

        const effect = cardEffectLabel(code);
        logText = `<b>${p.name}</b> 님이 ${cardAria(code)} 카드를 냈습니다${chosenSuit ? ` · ${SUIT_META[chosenSuit].name} 지정` : ''}`;
        r.lastAction = `${p.name}: ${cardAria(code)}`;

        if (p.hand.length === 0) {
          r.winner = p.id;
          r.phase = 'over';
          r.attack = 0;
          r.attackLevel = 0;
          return;
        }
        r.oneCardPlayer = (p.hand.length === 1 && r.oneCardDeclared[p.id]) ? p.id : null;

        if (c.attack > 0) {
          r.attack = (r.attack || 0) + c.attack;
          r.attackLevel = attackLevel(code);
          r.turn = nextTurnIndex(r, 1);
        } else if (c.rank === 'J') {
          r.attack = 0;
          r.attackLevel = 0;
          r.turn = nextTurnIndex(r, 2);
        } else if (c.rank === 'Q') {
          r.attack = 0;
          r.attackLevel = 0;
          r.direction = (r.direction || 1) * -1;
          r.turn = nextTurnIndex(r, 1);
        } else if (c.rank === 'K') {
          r.attack = 0;
          r.attackLevel = 0;
          // 같은 플레이어가 한 번 더 진행
        } else {
          r.attack = 0;
          r.attackLevel = 0;
          r.turn = nextTurnIndex(r, 1);
        }
      });
      if (logText) Core.log(roomId, logText);
    } finally {
      declareArmed = false;
      actionBusy = false;
    }
  }

  async function drawAndPass() {
    if (actionBusy) return;
    actionBusy = true;
    choiceCard = null;
    let logText = null;
    try {
      await Core.updateRoom(roomId, (r) => {
        if (r.phase !== 'playing') return false;
        const ps = seatedList(r);
        const cur = ps[mod(r.turn || 0, ps.length)];
        if (!cur || cur.id !== Core.me.id) return false;
        const p = r.players[Core.me.id];
        const count = (r.attack || 0) > 0 ? r.attack : 1;
        const drawn = drawCards(r, p, count);
        logText = `<b>${p.name}</b> 님이 카드 ${drawn}장을 받았습니다${r.attack ? ` · 공격 ${r.attack}` : ''}`;
        r.lastAction = `${p.name}: ${drawn}장 받음`;
        r.attack = 0;
        r.attackLevel = 0;
        r.oneCardPlayer = null;
        r.oneCardDeclared = r.oneCardDeclared || {};
        delete r.oneCardDeclared[p.id];
        r.turn = nextTurnIndex(r, 1);
      });
      if (logText) Core.log(roomId, logText);
    } finally {
      actionBusy = false;
    }
  }

  function botDecision(r, bot) {
    const hand = bot.hand || [];
    const playable = hand.filter((code) => isPlayable(code, r));
    if (!playable.length) return { draw: true };
    const scored = playable.map((code) => {
      const c = parseCard(code);
      let score = Math.random() * 3;
      if (c.attack) score += 22 + c.attack;
      if (c.rank === 'J') score += 15;
      if (c.rank === 'K') score += 13;
      if (c.rank === 'Q') score += 10;
      if (c.rank === '7') score += 8;
      if (c.joker && hand.length > 3) score -= 8;
      return { code, score };
    }).sort((a, b) => b.score - a.score);
    const code = scored[0].code;
    return { code, suit: needsSuit(code) ? chooseBestSuit(hand.filter((x) => x !== code)) : null };
  }

  function maybeBot() {
    clearTimeout(botTimer);
    if (!room || room.phase !== 'playing' || !isHost(room)) return;
    const ps = seatedList(room);
    const cur = ps[mod(room.turn || 0, ps.length)];
    if (!cur || !cur.bot) return;

    botTimer = setTimeout(async () => {
      if (!room || room.phase !== 'playing') return;
      const latestPs = seatedList(room);
      const latest = latestPs[mod(room.turn || 0, latestPs.length)];
      if (!latest || !latest.bot) return;
      const move = botDecision(room, latest);
      let logText = null;
      await Core.updateRoom(roomId, (r) => {
        if (r.phase !== 'playing') return false;
        const list = seatedList(r);
        const b = list[mod(r.turn || 0, list.length)];
        if (!b || !b.bot) return false;
        const bp = r.players[b.id];
        const decision = botDecision(r, bp);

        if (decision.draw) {
          const count = (r.attack || 0) > 0 ? r.attack : 1;
          const drawn = drawCards(r, bp, count);
          logText = `<b>${bp.name}</b> AI가 카드 ${drawn}장을 받았습니다`;
          r.lastAction = `${bp.name}: ${drawn}장 받음`;
          r.attack = 0;
          r.attackLevel = 0;
          r.oneCardPlayer = null;
          r.oneCardDeclared = r.oneCardDeclared || {};
          delete r.oneCardDeclared[bp.id];
          r.turn = nextTurnIndex(r, 1);
          return;
        }

        const code = decision.code;
        const c = parseCard(code);
        const at = bp.hand.indexOf(code);
        if (at < 0 || !isPlayable(code, r)) return false;
        const willHaveOne = bp.hand.length === 2;
        bp.hand.splice(at, 1);
        r.oneCardDeclared = r.oneCardDeclared || {};
        if (willHaveOne) r.oneCardDeclared[bp.id] = true;
        else if (bp.hand.length !== 1) delete r.oneCardDeclared[bp.id];
        r.discard.push(code);
        if (c.joker || c.rank === '7') r.currentSuit = decision.suit || 'S';
        else r.currentSuit = c.suit;
        logText = `<b>${bp.name}</b> AI가 ${cardAria(code)} 카드를 냈습니다`;
        r.lastAction = `${bp.name}: ${cardAria(code)}`;

        if (bp.hand.length === 0) {
          r.winner = bp.id;
          r.phase = 'over';
          r.attack = 0;
          r.attackLevel = 0;
          return;
        }
        r.oneCardPlayer = (bp.hand.length === 1 && r.oneCardDeclared[bp.id]) ? bp.id : null;
        if (c.attack > 0) {
          r.attack = (r.attack || 0) + c.attack;
          r.attackLevel = attackLevel(code);
          r.turn = nextTurnIndex(r, 1);
        } else if (c.rank === 'J') {
          r.attack = 0;
          r.attackLevel = 0;
          r.turn = nextTurnIndex(r, 2);
        } else if (c.rank === 'Q') {
          r.attack = 0;
          r.attackLevel = 0;
          r.direction = (r.direction || 1) * -1;
          r.turn = nextTurnIndex(r, 1);
        } else if (c.rank === 'K') {
          r.attack = 0;
          r.attackLevel = 0;
        } else {
          r.attack = 0;
          r.attackLevel = 0;
          r.turn = nextTurnIndex(r, 1);
        }
      });
      if (logText) Core.log(roomId, logText);
    }, 780);
  }

      const code = btn.dataset.card;
      if (!myTurn || !isPlayable(code, r)) return;
      if (needsSuit(code)) {
        choiceCard = code;
        renderGame(r);
      } else {
        playCard(code, null, declareArmed);
      }
    }));
    board.querySelectorAll('[data-suit]').forEach((btn) => btn.addEventListener('click', () => playCard(choiceCard, btn.dataset.suit, declareArmed)));
    document.getElementById('suitCancel')?.addEventListener('click', () => {
      choiceCard = null;
      renderGame(r);
    });
    document.getElementById('suitBackdrop')?.addEventListener('click', (e) => {
      if (e.target.id === 'suitBackdrop') {
        choiceCard = null;
        renderGame(r);
      }
    });
  }

  function renderOver(r) {
    choiceCard = null;
    const ps = seatedList(r).slice().sort((a, b) => {
      if (a.id === r.winner) return -1;
      if (b.id === r.winner) return 1;
      return (a.hand || []).length - (b.hand || []).length;
    });
    const winner = r.players?.[r.winner];

    board.innerHTML = `
      <div class="lobby">
        <div class="eyebrow">게임 종료</div>
        <h2>${winner ? `${Core.esc(winner.name)} 님 승리` : '결과'}</h2>
        <p class="lobby-description">손에 든 카드를 가장 먼저 모두 없앴습니다.</p>
        <div class="result-podium">
          ${ps.map((p, i) => `<div class="result-row ${p.id === r.winner ? 'win' : ''}">
            <span class="result-rank">${i + 1}</span>
            <span class="result-name">${Core.esc(p.name)}${p.id === r.winner ? ' · 승리' : ''}</span>
            <small>남은 카드 ${(p.hand || []).length}장</small>
          </div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${isHost(r) ? '<button class="btn btn-primary" id="btnAgain">한 판 더</button>' : ''}
          <a class="btn" href="index.html">자료실 목록으로</a>
        </div>
      </div>`;

    document.getElementById('btnAgain')?.addEventListener('click', async () => {
      await Core.updateRoom(roomId, (rr) => {
        rr.phase = 'lobby';
        rr.seed = Math.floor(Math.random() * 2147483647);
        Object.values(rr.players || {}).forEach((p) => {
          p.hand = [];
          p.ready = !!p.bot;
        });
        ['deck','discard','currentSuit','attack','attackLevel','direction','turn','winner','oneCardPlayer','oneCardDeclared','shuffleCount','lastAction','startedAt']
          .forEach((key) => delete rr[key]);
      });
    });
  }

  Core.onRoom(roomId, (r) => {
    if (!r) {
      board.innerHTML = '<div class="empty-state">자료실이 사라졌습니다. ' +
        '<a href="index.html" style="color:var(--brass)">자료실 목록</a></div>';
      return;
    }
    if (!r.players || !r.players[Core.me.id]) {
      board.innerHTML = '<div class="empty-state">이 자료실에서 나간 상태입니다. ' +
        '<a href="index.html" style="color:var(--brass)">자료실 목록</a></div>';
      return;
    }

    room = r;
    document.body.dataset.gamePhase = r.phase || 'lobby';
    if (r.phase !== lastPhase) {
      lastPhase = r.phase;
      if (r.phase === 'over' && r.players?.[r.winner]) {
        Core.sys(roomId, `게임 종료 — ${r.players[r.winner].name} 님 승리`);
      }
    }

    if (r.phase === 'lobby') renderLobby(r);
    else if (r.phase === 'playing') { renderGame(r); maybeBot(); }
    else renderOver(r);
  });

  window.addEventListener('pagehide', () => Core.stopHeartbeat());
  document.addEventListener('click', (e) => {
    if (e.target.closest('a[href="index.html"]')) sessionStorage.setItem('table9:suppressRejoinOnce', '1');
  });
  document.querySelector('[data-leave]').addEventListener('click', async () => {
    if (room && room.phase === 'playing') {
      if (!confirm('게임이 진행 중입니다. 나가면 참가자 목록에서 제거됩니다. 계속하시겠습니까?')) return;
    }
    await Core.leaveRoom(roomId).catch(() => {});
    location.href = 'index.html';
  });
})();
</script>

<script id="v2-9-109-onecard-consistency">
(() => {
  const syncSideForPhase = () => {
    const phase = document.body.dataset.gamePhase || 'lobby';
    const chat = document.getElementById('chatPane');
    const log = document.getElementById('logPane');
    const tabs = document.querySelector('.side-tabs');
    if (!chat || !log || !tabs) return;
    if (phase === 'lobby' && matchMedia('(max-width: 860px)').matches) {
      tabs.style.display = 'none';
      chat.classList.remove('hidden');
      log.classList.add('hidden');
    } else {
      tabs.style.removeProperty('display');
    }
  };
  let savedHandScroll = 0;
  document.addEventListener('scroll', (event) => {
    const hand = event.target?.closest?.('.oc-hand');
    if (hand) savedHandScroll = hand.scrollLeft;
  }, true);
  const restore = () => {
    syncSideForPhase();
    const hand = document.querySelector('.oc-hand');
    if (hand) requestAnimationFrame(() => {
      const max = Math.max(0, hand.scrollWidth - hand.clientWidth);
      hand.scrollLeft = Math.min(savedHandScroll, max);
    });
  };
  new MutationObserver(restore).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-game-phase'] });
  addEventListener('resize', restore, { passive: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', restore, { once: true });
  else restore();
})();
</script>
