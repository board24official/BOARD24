<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회원 등급 관리 — BOARD 24</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#1B1D2A">
<link rel="stylesheet" href="assets/app.css">
<style>
/* ---------- LADDER 전용 ---------- */
.ladder-stage {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 14px;
}

/* 상단: 좌석 계급표 */
.rank-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.rank-card {
  flex: 0 0 auto;
  width: 128px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--ink-2);
  transition: border-color .16s, background .16s;
}
.rank-card.active {
  border-color: #3971e7;
  background: #eef4ff;
  box-shadow: 0 0 0 1px #3971e7 inset;
}
.rank-card.out { opacity: .45; }
.rank-card .title {
  font-family: var(--f-mono);
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.rank-card .nm { font-size: 13px; font-weight: 500; }
.rank-card .cnt {
  font-family: var(--f-mono);
  font-size: 11.5px;
  color: var(--cream-dim);
  margin-top: 4px;
}
.rank-card .passed {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--red);
  margin-top: 2px;
}
.rank-card .lead-mark {
  display: inline-flex;
  margin-top: 6px;
  padding: 3px 6px;
  border-radius: 4px;
  background: #3971e7;
  color: #fff;
  font: 700 10px/1.2 var(--f-mono);
}
.round-status {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 42px;
  padding: 9px 13px;
  border: 1px solid #b9cbed;
  border-radius: 7px;
  background: #eef4ff;
  color: #24344e;
  font-size: 13px;
}
.round-status .status-label {
  flex-shrink: 0;
  padding: 3px 7px;
  border-radius: 4px;
  background: #3971e7;
  color: #fff;
  font: 700 10px var(--f-mono);
}
.round-status b { color: #17253c; }
.round-status small { margin-left: auto; color: #62718a; }

/* 계급별 색 */
.r-ceo    { color: var(--brass); }
.r-exec   { color: #d8ab4d; }
.r-mid    { color: var(--cream-dim); }
.r-junior { color: #8fb0dd; }
.r-intern { color: #9aa0bb; }

/* 중앙: 플레이 영역 */
.play-area {
  flex: 1;
  display: grid;
  place-items: center;
  min-height: 180px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: #ffffff;
  padding: 20px;
}
.pile { display: flex; gap: 7px; align-items: center; }
.pile-empty {
  font-family: var(--f-mono);
  font-size: 12.5px;
  color: var(--cream-dim);
  text-align: center;
}

/* 카드 */
.lcard {
  width: 62px; height: 88px;
  border-radius: 5px;
  border: 1px solid #cbd4e0;
  background: #ffffff;
  color: #202633;
  position: relative;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-card);
  flex-shrink: 0;
}
.lcard .rk {
  font-family: var(--f-display);
  font-size: 34px;
  line-height: 1;
}
.lcard .lb {
  position: absolute;
  bottom: 5px;
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: .04em;
  color: #6d6a62;
  text-align: center;
  width: 100%;
  padding: 0 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lcard .cr {
  position: absolute;
  top: 4px; left: 6px;
  font-family: var(--f-mono);
  font-size: 10px;
  color: #6d6a62;
}
.lcard.joker {
  border-color: #253a64;
  background: linear-gradient(150deg, #315dba, #1f3156);
  color: #ffffff;
}
.lcard.joker .rk { font-size: 22px; }
.lcard.joker .lb, .lcard.joker .cr { color: #dbe6fa; }

/* 내 손패 */
.hand-wrap {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.hand-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.hand-head .my-rank {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.hand {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 16px 2px 10px;
  min-height: 116px;
  max-width: 100%;
  scroll-behavior: smooth;
  overscroll-behavior-x: contain;
  scrollbar-gutter: stable;
  -webkit-overflow-scrolling: touch;
}
.hand::-webkit-scrollbar { height: 10px; }
.hand::-webkit-scrollbar-track { background: rgba(255,255,255,.08); border-radius: 999px; }
.hand::-webkit-scrollbar-thumb { background: rgba(210,178,104,.72); border-radius: 999px; }
.hand::-webkit-scrollbar-thumb:hover { background: rgba(210,178,104,.95); }
#taxHand { cursor: ew-resize; }
.hand .lcard { cursor: pointer; transition: transform .14s, box-shadow .14s; }
.hand .lcard.sel { transform: translateY(-14px); box-shadow: 0 12px 26px rgba(0,0,0,.45); }
.hand .lcard.dim { opacity: .58; cursor: not-allowed; }
.hand .lcard .stack {
  position: absolute;
  top: -8px; right: -6px;
  background: var(--brass);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 100px;
}

.hand-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.turn-note {
  font-family: var(--f-mono);
  font-size: 12.5px;
  color: var(--cream-dim);
}

/* 세금 단계 */
.tax-panel {
  max-width: 560px;
  margin: 20px auto;
  padding: 22px;
  border: 1px solid var(--brass-dim);
  border-radius: var(--radius);
  background: var(--ink-2);
}
.tax-panel h3 {
  font-family: var(--f-display);
  font-size: 26px;
  margin: 4px 0 6px;
  font-weight: 400;
}

/* 로비 */
.lobby { max-width: 600px; margin: 30px auto; }
.lobby h2 { font-family: var(--f-display); font-size: 34px; margin: 0 0 4px; font-weight: 400; }
.lobby-players { display: flex; flex-direction: column; gap: 7px; margin: 22px 0; }
.lobby-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--ink-2);
}
.lobby-row .badge {
  font-family: var(--f-mono); font-size: 10.5px;
  padding: 2px 6px; border-radius: 2px;
  background: var(--ink-3); color: var(--cream-dim);
}
.lobby-row .badge.ready { background: var(--green); color: #fff; }
.lobby-row .badge.host { background: var(--brass); color: var(--ink); }

.result-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.result-table th, .result-table td {
  padding: 9px 10px; text-align: left;
  border-bottom: 1px solid var(--line); font-size: 13.5px;
}
.result-table th {
  font-family: var(--f-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--cream-dim); font-weight: 500;
}
.result-table tr.win td { color: var(--brass); font-weight: 600; }

/* 첫 라운드 직급 카드 선택 */
.rank-draw { max-width: 920px; margin: 18px auto; text-align: center; }
.rank-draw h2 { margin: 0 0 6px; font-size: 28px; }
.rank-draw > p { margin: 0 0 22px; color: var(--cream-dim); }
.rank-draw-cards {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 12px;
  margin: 22px 0;
}
.rank-pick {
  width: 92px; height: 132px; padding: 0;
  border: 2px solid #c8d2e0; border-radius: 9px;
  background: linear-gradient(145deg, #315dba, #1f3156);
  color: #fff; box-shadow: 0 6px 16px rgba(31,49,86,.18);
  display: grid; place-items: center; cursor: pointer;
  font-weight: 700; transition: transform .16s, border-color .16s;
}
.rank-pick:not([disabled]):hover { transform: translateY(-6px); border-color: #78a0ff; }
.rank-pick[disabled] { cursor: default; opacity: .48; }
.rank-pick.mine { opacity: 1; border-color: #3971e7; box-shadow: 0 0 0 3px rgba(57,113,231,.18); }
.rank-pick.reveal { opacity: 1; background: #fff; color: #202633; border-color: #b8c4d5; }
.rank-pick .pick-no { font-size: 34px; line-height: 1; }
.rank-pick small { display: block; margin-top: 8px; font-size: 10px; font-weight: 500; }
.rank-draw-list {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px; margin-top: 18px; text-align: left;
}
.rank-draw-list div {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: #fff;
}
.rank-draw-list b, .rank-draw-list small { display: block; }
.rank-draw-list small { color: var(--cream-dim); margin-top: 2px; }

@media (max-width: 860px) {
  .ladder-stage { height: auto; min-height: 0; gap: 4px; }
  .rank-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 3px;
    overflow: visible;
    padding-bottom: 2px;
  }
  .rank-card {
    width: auto;
    min-width: 0;
    min-height: 57px;
    padding: 4px;
    border-radius: 6px;
    display: block;
  }
  .rank-card .title { margin-bottom: 2px; font-size: 6px; }
  .rank-card .nm { overflow: hidden; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
  .rank-card .cnt { margin-top: 2px; font-size: 6.5px; white-space: nowrap; }
  .rank-card .passed { margin-top: 1px; font-size: 6px; }
  .rank-card .lead-mark {
    display: inline-block;
    margin-top: 2px;
    padding: 1px 2px;
    font-size: 5.5px;
  }
  .round-status {
    position: sticky;
    top: -8px;
    z-index: 8;
    min-height: 28px;
    padding: 5px 7px;
    gap: 5px;
    align-items: flex-start;
    flex-wrap: wrap;
    font-size: 8.5px;
  }
  .round-status .status-label { padding: 2px 4px; font-size: 7px; }
  .round-status small { width: 100%; margin-left: 0; padding-left: 0; }
  .play-area { min-height: 76px; padding: 6px; border-radius: 6px; }
  .pile { gap: 3px; }
  .pile-empty { font-size: 8px; }
  .lcard { width: 42px; height: 58px; }
  .lcard .rk { font-size: 22px; }
  .lcard .lb { bottom: 3px; font-size: 5.5px; }
  .lcard .cr { top: 3px; left: 4px; font-size: 6px; }
  .lcard.joker .rk { font-size: 14px; }
  .hand-wrap { padding-top: 4px; }
  .hand-head { gap: 5px; margin-bottom: 1px; font-size: 8px; }
  .hand-head .my-rank { font-size: 7px; }
  .hand {
    min-height: 64px;
    padding: 6px 2px 2px;
    gap: 3px;
    overflow: visible;
    flex-wrap: wrap;
    align-content: flex-start;
  }
  .hand .lcard { width: 36px; height: 50px; }
  .hand .lcard .rk { font-size: 19px; }
  .hand .lcard.joker .rk { font-size: 12px; }
  .hand .lcard.sel { transform: translateY(-3px); }
  .hand .lcard .stack { top: -4px; right: -3px; padding: 1px 3px; font-size: 6px; }
  .hand-actions {
    position: sticky;
    bottom: -8px;
    z-index: 12;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
    padding: 7px;
    border: 1px solid #d8e0eb;
    border-radius: 9px;
    background: rgba(255,255,255,.97);
    box-shadow: 0 -5px 16px rgba(31,49,86,.10);
  }
  .hand-actions .btn {
    width: 100%;
    min-height: 44px;
    padding: 8px 7px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    touch-action: manipulation;
  }
  .hand-actions #btnClear {
    grid-column: 1 / -1;
    min-height: 34px;
  }
  .turn-note { font-size: 8px; }
  .rank-draw { margin: 4px auto; }
  .rank-draw h2 { margin-bottom: 3px; font-size: 17px; }
  .rank-draw > p { margin-bottom: 8px; font-size: 9px; }
  .rank-draw-cards { gap: 5px; margin: 8px 0; }
  .rank-pick { width: 48px; height: 68px; border-width: 1px; border-radius: 6px; }
  .rank-pick .pick-no { font-size: 20px; }
  .rank-pick small { margin-top: 4px; font-size: 6.5px; }
  .rank-draw-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 7px; }
  .rank-draw-list div { padding: 5px; font-size: 8px; }
  .rank-draw-list small { font-size: 7px; }
}

/* 공통 로비 초대 및 차례 순서 표시 */
.invite-panel { margin-top:14px; padding:13px; border:1px solid var(--line); border-radius:9px; background:#f8faff; }
.invite-panel-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
.invite-panel-head b { color:#202633; font-size:13px; }
.invite-panel-head small { color:#778398; font-size:10px; }
.invite-people { display:flex; flex-direction:column; gap:6px; }
.invite-person { display:flex; align-items:center; gap:8px; padding:8px 9px; border:1px solid #dce4ef; border-radius:7px; background:#fff; }
.invite-person .person-info { min-width:0; flex:1; }
.invite-person .person-info b { display:block; overflow:hidden; color:#263148; font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
.invite-person .person-info small { display:block; margin-top:1px; color:#7a8597; font-size:10px; }
.invite-person button { min-width:62px; padding:6px 9px; font-size:10.5px; }
.invite-empty { padding:10px; color:#7a8597; font-size:11px; text-align:center; }
.turn-sequence { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:0 0 10px; }
.turn-sequence > div { min-width:0; padding:9px 10px; border:1px solid #d8e0eb; border-radius:8px; background:#fff; text-align:center; }
.turn-sequence span { display:block; color:#7a8597; font-size:10px; }
.turn-sequence b { display:block; overflow:hidden; margin-top:3px; color:#263148; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
.turn-sequence .current { border-color:#3971e7; background:#eef4ff; box-shadow:0 0 0 1px #3971e7 inset; }
.turn-sequence .current b { color:#2859bd; }
@media (max-width:560px){ .turn-sequence{gap:4px}.turn-sequence>div{padding:7px 5px}.turn-sequence b{font-size:11px}.turn-sequence span{font-size:8.5px} }


/* v2.9.47 — 방장 참가자 내보내기 버튼을 X 아이콘으로 표시 */
.lobby-remove {
  display: inline-grid !important;
  place-items: center !important;
  width: 26px !important;
  min-width: 26px !important;
  height: 26px !important;
  padding: 0 !important;
  border-radius: 50% !important;
  font-size: 17px !important;
  line-height: 1 !important;
  font-weight: 500 !important;
}
</style>

<style id="v2-9-107-ladder-mobile-polish">
/* 회원 등급 관리 — 공통/모바일 최종 정리 */
.game-topbar .gt-title,
.game-topbar .gt-room,
.lobby, .lobby-row, .round-status, .rank-card, .tax-panel,
.side-pane, .side-pane * {
  overflow-wrap: anywhere;
  word-break: keep-all;
}
[data-leave] { white-space: nowrap; }

@media (max-width: 860px) {
  .game-topbar {
    display: flex !important;
    align-items: center !important;
    gap: 5px !important;
    padding-left: max(7px, env(safe-area-inset-left)) !important;
    padding-right: max(7px, env(safe-area-inset-right)) !important;
    overflow: visible !important;
  }
  .game-topbar > div:not(.spacer) { min-width: 0 !important; }
  .game-topbar .gt-title { font-size: 14px !important; white-space: nowrap !important; }
  .game-topbar .gt-room { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-topbar .header-action {
    flex: 0 0 auto !important;
    min-width: 34px !important;
    width: 34px !important;
    padding: 0 !important;
  }
  .game-topbar .header-label { display: none !important; }
  .game-topbar .header-icon { font-size: 17px !important; }
  #sideToggle { flex: 0 0 auto; min-width: 44px; padding: 6px 8px; }

  /* 손패는 한 줄 가로 스크롤로 유지 */
  .hand {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    min-height: 66px !important;
    padding: 7px 2px 5px !important;
    scroll-behavior: auto !important;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .hand .lcard { flex: 0 0 36px !important; }

  /* 로비에서는 채팅만 표시 */
  body[data-game-phase="lobby"] .side-tabs { display: none !important; }
  body[data-game-phase="lobby"] #logPane { display: none !important; }
  body[data-game-phase="lobby"] #chatPane { display: flex !important; }
  body[data-game-phase="lobby"] .side { grid-template-rows: minmax(120px, 1fr) auto !important; }

  /* 게임/직급선택/세금 단계에서는 채팅과 기록 모두 사용 */
  body[data-game-phase="playing"] .side-tabs,
  body[data-game-phase="rank_draw"] .side-tabs,
  body[data-game-phase="tax"] .side-tabs,
  body[data-game-phase="over"] .side-tabs { display: flex !important; }

  .modal-back { padding: max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom)) !important; }
  .modal {
    width: min(94vw, 520px) !important;
    max-height: calc(100dvh - 28px) !important;
    overflow-y: auto !important;
    overscroll-behavior: contain;
  }
  .bot-paywall .modal-actions { position: sticky; bottom: 0; background: inherit; padding-top: 8px; }
}
</style>

<style id="board24-ai-assist-style">
.ai-assist-toggle {
  position: relative;
  font-weight: 700;
}
.ai-assist-toggle .ai-assist-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  line-height: 1;
  letter-spacing: -.3px;
}
.ai-assist-toggle.is-on {
  border-color: #4f8f6b !important;
  background: #eaf7ef !important;
  color: #23613e !important;
}
.ai-assist-toggle.is-on::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: #2f9a59;
}
.ai-assist-toggle:disabled {
  opacity: .45;
  cursor: not-allowed;
}
@media (max-width: 860px) {
  .ai-assist-toggle .ai-assist-mark {
    font-size: 8px;
  }
}
</style>

      </svg><span class="header-label">알림</span>
    </button>
    <button class="btn btn-ghost btn-sm header-action ai-assist-toggle" id="aiAssistToggle"
      type="button" title="AI 대리 켜기" aria-label="AI 대리 켜기" aria-pressed="false">
      <span class="header-icon ai-assist-mark" aria-hidden="true">AI</span><span class="header-label">AI 전환</span>
    </button>
    <button class="btn btn-ghost btn-sm header-action" data-leave title="나가기" aria-label="나가기">
      <span class="header-icon" aria-hidden="true">↗</span><span class="header-label">나가기</span>
    </button>
    <button class="btn btn-ghost btn-sm mobile-only" id="sideToggle">채팅</button>
  </header>

  <div class="board" id="board">
    <div class="empty-state">불러오는 중…</div>
  </div>

  <aside class="side">
    <div class="side-tabs">
      <button data-tab="chat" aria-selected="true">채팅</button>
      <button data-tab="log" aria-selected="false">기록</button>
    </div>
    <div class="side-pane" id="chatPane"></div>
    <div class="side-pane hidden" id="logPane"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" maxlength="200" placeholder="메시지 입력" autocomplete="off">
      <button class="btn btn-sm" id="chatSend">전송</button>
    </div>
  </aside>
</div>

<script src="assets/firebase.js"></script>
<script src="assets/core.js"></script>
<script>
/* ==========================================================
   STATUS LADDER — 규칙
   - 카드: 1이 1장, 2가 2장 … 12가 12장 (78장) + 비서(조커) 2장 = 80장
   - 숫자가 낮을수록 강함. 비서는 와일드.
   - 첫 판은 카드 뽑기로 계급 결정, 이후 판은 나간 순서가 계급.
   - 판 시작 전 세금: 인턴→CEO 최고 카드 2장, 부인턴→이사 1장.
     CEO/이사는 아무 카드나 골라 되돌려줌.
   - 리드 플레이어가 같은 숫자 N장을 냄. 이후 사람은 같은 장수의
     더 낮은 숫자만 낼 수 있음. 못 내면 패스.
   - 한 바퀴가 끝나면 마지막에 낸 사람이 새로 리드.
   - 손패를 먼저 비운 순서대로 CEO → 이사 → … → 인턴
   ========================================================== */
(async function () {
  'use strict';

  if (window.T9_FIREBASE && window.T9_FIREBASE._pending) {
    try { await window.T9_FIREBASE._pending; } catch (_) {}
  }
  await Core.init();

  async function startAdminSpectator(roomId, board) {
    const esc = (value) => Core.esc(String(value ?? ''));
    document.body.classList.add('admin-spectator-mode');
    document.getElementById('roomLabel').textContent = '관리자 관전 · 자료실 코드 ' + roomId;

    const style = document.createElement('style');
    style.textContent = `
      .admin-spectator-mode [data-leave] { display:none !important; }
      .admin-watch { max-width:1180px; margin:0 auto; padding:18px; }
      .admin-watch-banner { display:flex; justify-content:space-between; gap:14px; align-items:center; padding:15px 17px; margin-bottom:14px; border:1px solid #c8d7f3; border-radius:14px; background:#edf4ff; color:#183b75; }
      .admin-watch-banner b { display:block; font-size:16px; margin-bottom:3px; }
      .admin-watch-banner small { color:#526b91; }
      .admin-watch-grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
      .admin-watch-card { background:#fff; border:1px solid #dde4ef; border-radius:14px; overflow:hidden; }
      .admin-watch-head { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid #e7ecf3; }
      .admin-watch-head h3 { margin:0; font-size:15px; }
      .admin-watch-body { padding:15px 16px; }
      .admin-watch-state { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
      .admin-watch-stat { padding:11px; border:1px solid #e4e9f1; border-radius:10px; background:#f8fafc; min-width:0; }
      .admin-watch-stat span { display:block; color:#6b778b; font-size:11px; margin-bottom:5px; }
      .admin-watch-stat b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .admin-watch-players { display:flex; flex-direction:column; gap:8px; }
      .admin-watch-player { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:11px 12px; border:1px solid #e4e9f1; border-radius:11px; }
      .admin-watch-player strong { display:block; }
      .admin-watch-player small { display:block; margin-top:3px; color:#728096; }
      .admin-watch-actions { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
      .admin-watch button { border:1px solid #cbd5e1; background:#fff; color:#26364c; padding:7px 9px; border-radius:8px; font:inherit; font-size:12px; cursor:pointer; }
      .admin-watch button:hover { background:#f3f6fa; }
      .admin-watch button.primary { border-color:#3468d4; background:#3468d4; color:#fff; }
      .admin-watch button.danger { border-color:#e3a4aa; color:#b32635; }
      .admin-watch button:disabled { opacity:.55; cursor:wait; }
      .admin-watch-note { color:#6b778b; font-size:12px; line-height:1.6; }
      .admin-watch-hands { margin-top:12px; display:flex; flex-direction:column; gap:7px; }
      .admin-watch-hand { padding:9px 10px; border-radius:9px; background:#f7f9fc; font-size:12px; word-break:break-all; }
      @media(max-width:760px){ .admin-watch-grid{grid-template-columns:1fr}.admin-watch-state{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-watch{padding:10px}.admin-watch-player{grid-template-columns:1fr}.admin-watch-actions{justify-content:flex-start} }
    `;
    document.head.appendChild(style);

    board.innerHTML = `<div class="admin-watch"><div class="admin-watch-banner"><div><b>관리자 관전 모드</b><small>참가자·좌석·대기 목록에 포함되지 않으며 게임 조작은 할 수 없습니다.</small></div><button type="button" data-admin-exit>목록으로</button></div><div class="empty-state">게임 상태를 불러오는 중…</div></div>`;
    board.querySelector('[data-admin-exit]')?.addEventListener('click', () => { location.href = 'index.html'; });

    const gameNames = { outlaw:'사용자 검증 프로세스', pass:'업무 우선순위', ladder:'회원 등급 관리', onecard:'업무 카드 전달' };
    const phaseNames = { lobby:'대기 중', playing:'진행 중', over:'종료' };

    function handText(player, game) {
      const hand = Array.isArray(player.hand) ? player.hand : [];
      if (!hand.length) return '손패 없음';
      if (game === 'onecard') return hand.join(' · ');
      if (game === 'ladder') return hand.join(', ');
      if (game === 'outlaw') return hand.map((c) => typeof c === 'string' ? c : (c?.name || c?.id || JSON.stringify(c))).join(' · ');
      return hand.join(', ');
    }

    function stateItems(r, players) {
      const current = players[((Number(r.turn) || 0) % Math.max(1, players.length))];
      const common = [
        ['상태', phaseNames[r.phase] || r.phase || '-'],
        ['현재 차례', current?.name || '-'],
        ['참가자', `${players.length}/${r.maxSeats || '-'}`]
      ];
      if (r.game === 'onecard') {
        const top = Array.isArray(r.discard) && r.discard.length ? r.discard[r.discard.length - 1] : '-';
        return common.concat([['바닥 카드', top], ['현재 문양', r.currentSuit || '-'], ['누적 공격', r.attack || 0], ['방향', Number(r.direction) < 0 ? '역방향' : '정방향']]);
      }
      if (r.game === 'pass') return common.concat([['현재 숫자', r.tile ?? '-'], ['칩 더미', r.pot ?? 0], ['남은 카드', Array.isArray(r.deck) ? r.deck.length : '-']]);
      if (r.game === 'ladder') {
        const pile = r.pile ? `${r.pile.rank ?? '-'} × ${r.pile.count ?? '-'}` : '없음';
        return common.concat([['현재 제출', pile], ['혁명', r.revolution ? '진행 중' : '아니오'], ['완주', Array.isArray(r.finishOrder) ? r.finishOrder.length : 0]]);
      }
      if (r.game === 'outlaw') return common.concat([['진행 단계', r.step || '-'], ['대기 효과', r.pending?.type || '없음'], ['남은 덱', Array.isArray(r.deck) ? r.deck.length : '-']]);
      return common;
    }

    function playerMeta(p, r) {
      const bits = [`좌석 ${Number(p.seat) + 1}`, p.bot ? 'AI' : '사용자'];
      if (r.phase === 'lobby') bits.push(p.ready ? '준비' : '미준비');
      if (Array.isArray(p.hand)) bits.push(`손패 ${p.hand.length}장`);
      if (typeof p.hp === 'number') bits.push(`체력 ${p.hp}/${p.maxHp ?? '?'}`);
      if (typeof p.chips === 'number') bits.push(`칩 ${p.chips}`);
      if (typeof p.score === 'number') bits.push(`점수 ${p.score}`);
      if (p.role) bits.push(`역할 ${p.role}`);
      return bits.join(' · ');
    }

    function render(r) {
      if (!r) {
        board.innerHTML = `<div class="admin-watch"><div class="admin-watch-banner"><div><b>관리자 관전 모드</b><small>해당 자료실이 삭제되었거나 만료되었습니다.</small></div><button type="button" data-admin-exit>목록으로</button></div></div>`;
        board.querySelector('[data-admin-exit]')?.addEventListener('click', () => { location.href = 'index.html'; });
        return;
      }
      const players = Object.values(r.players || {}).sort((a,b) => (a.seat||0)-(b.seat||0));
      const stats = stateItems(r, players).map(([label,value]) => `<div class="admin-watch-stat"><span>${esc(label)}</span><b>${esc(value)}</b></div>`).join('');
      const playerRows = players.map((p) => `<div class="admin-watch-player"><div><strong>${esc(p.name)}${p.id === r.host ? ' · 방장' : ''}</strong><small>${esc(playerMeta(p,r))}</small></div><div class="admin-watch-actions">${p.bot ? '' : `<button type="button" data-admin-command="convert_ai" data-player="${esc(p.id)}">AI 전환</button>`}<button type="button" class="danger" data-admin-command="kick_player" data-player="${esc(p.id)}">강퇴</button></div></div>`).join('') || '<div class="admin-watch-note">참가자가 없습니다.</div>';
      const hands = players.map((p) => `<div class="admin-watch-hand"><b>${esc(p.name)}</b> · ${esc(handText(p,r.game))}</div>`).join('');
      board.innerHTML = `<div class="admin-watch">
        <div class="admin-watch-banner"><div><b>관리자 관전 모드 · ${esc(gameNames[r.game] || r.game)}</b><small>게임에 참여하지 않고 실시간 상태를 관전합니다.</small></div><button type="button" data-admin-exit>목록으로</button></div>
        <div class="admin-watch-grid">
          <div class="admin-watch-card"><div class="admin-watch-head"><h3>${esc(r.title || '게임방')}</h3><span>${esc(phaseNames[r.phase] || r.phase || '')}</span></div><div class="admin-watch-body"><div class="admin-watch-state">${stats}</div><div class="admin-watch-hands">${hands}</div></div></div>
          <div><div class="admin-watch-card"><div class="admin-watch-head"><h3>관리자 제어</h3></div><div class="admin-watch-body"><div class="admin-watch-actions" style="justify-content:flex-start;margin-bottom:13px"><button type="button" class="primary" data-admin-command="skip_turn">턴 넘기기</button><button type="button" data-admin-command="reset_game">게임 초기화</button><button type="button" class="danger" data-admin-command="delete_room">방 삭제</button></div><div class="admin-watch-note">관리자 관전자는 좌석을 차지하지 않으며 카드 제출·뽑기·준비 등의 게임 행동을 할 수 없습니다.</div></div></div><div class="admin-watch-card" style="margin-top:12px"><div class="admin-watch-head"><h3>참가자 관리</h3></div><div class="admin-watch-body"><div class="admin-watch-players">${playerRows}</div></div></div></div>
        </div></div>`;
      board.querySelector('[data-admin-exit]')?.addEventListener('click', () => { location.href = 'index.html'; });
      board.querySelectorAll('[data-admin-command]').forEach((button) => button.addEventListener('click', async () => {
        const command = button.dataset.adminCommand;
        const playerId = button.dataset.player || '';
        const labels = { convert_ai:'이 참가자를 AI로 전환', kick_player:'이 참가자를 강퇴', skip_turn:'현재 턴을 넘김', reset_game:'게임을 대기실로 초기화', delete_room:'게임방을 삭제' };
        if (!confirm(`${labels[command] || '관리 작업을 실행'}하시겠습니까?`)) return;
        button.disabled = true;
        try {
          await Core.adminAction(roomId, command, playerId);
          Core.toast('관리자 작업을 완료했습니다.');
          if (command === 'delete_room') location.href = 'index.html';
        } catch (error) {
          Core.toast(error.message || '관리자 작업에 실패했습니다.');
          button.disabled = false;
        }
      }));
    }

    Core.onRoom(roomId, render);
  }


  const params = new URLSearchParams(location.search);
  const roomId = params.get('room');
  if (!roomId) { location.href = 'index.html'; return; }

  const board = document.getElementById('board');
  const adminState = await Core.adminStatus().catch(() => ({ admin: false }));
  const adminSpectator = !!adminState.admin && params.get('spectate') === '1';
  if (adminSpectator) {
    await startAdminSpectator(roomId, board);
    return;
  }

  if (!Core.requireLogin()) return;
  try {
    await Core.joinRoom(roomId);
  } catch (err) {
    board.innerHTML = `<div class="empty-state">재접속하지 못했습니다. ${Core.esc(err.message)}
      <br><a href="index.html" style="color:var(--brass)">자료실 목록</a></div>`;
    return;
  }
  document.getElementById('roomLabel').textContent = '자료실 코드 ' + roomId;

  Core.mountSide(roomId, { mobileDefaultTab: 'log' });
  Core.startHeartbeat(roomId);

  let room = null;

  const aiAssistToggle = document.getElementById('aiAssistToggle');

  function isAutoControlled(player) {
    return !!(player && (player.bot || player.aiAssist));
  }

  function paintAiAssist(r) {
    const me = r && r.players ? r.players[Core.me.id] : null;
    const enabled = !!(me && me.aiAssist && !me.bot);
    if (!aiAssistToggle) return;

    aiAssistToggle.classList.toggle('is-on', enabled);
    aiAssistToggle.setAttribute('aria-pressed', String(enabled));
    aiAssistToggle.disabled = !me || !!me.bot || r.phase === 'over';

    const title = enabled ? 'AI 대리 끄기' : 'AI 대리 켜기';
    aiAssistToggle.title = title;
    aiAssistToggle.setAttribute('aria-label', title);

    const label = aiAssistToggle.querySelector('.header-label');
    if (label) label.textContent = enabled ? 'AI ON' : 'AI 전환';
    document.body.classList.toggle('ai-assist-on', enabled);
  }

  aiAssistToggle?.addEventListener('click', async () => {
    const current = room && room.players ? room.players[Core.me.id] : null;
    if (!current || current.bot) return;

    const turnOn = !current.aiAssist;
    await Core.updateRoom(roomId, (r) => {
      const player = r && r.players ? r.players[Core.me.id] : null;
      if (!player || player.bot) return false;
      player.aiAssist = turnOn;
      player.aiAssistAt = turnOn ? Core.now() : null;
    });

    Core.toast(turnOn
      ? 'AI 대리를 켰습니다. 내 차례와 필요한 선택을 AI가 대신 진행합니다.'
      : 'AI 대리를 껐습니다. 이제 직접 진행합니다.');
  });
  let lobbyPeople = [];
  let invitePresenceTimer = null;
  refreshLobbyPeople();
  invitePresenceTimer = setInterval(refreshLobbyPeople, 5000);
  async function inviteApi(payload, query) {
    const url = 'api.php' + (query ? '?' + new URLSearchParams(query) : '');
    const res = await fetch(url, query ? { cache:'no-store' } : { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || '초대 처리에 실패했습니다.');
    return data;
  }
  async function refreshLobbyPeople() {
    if (!Core.me) return;
    try {
      await inviteApi({ action:'presence_beat', userId:Core.me.id, name:Core.me.name, dept:Core.me.dept || '', page:'game' });
      const data = await inviteApi(null, { action:'presence', userId:Core.me.id });
      lobbyPeople = (data.people || []).filter((p) => p.id !== Core.me.id && p.page === 'lobby');
      if (room && room.phase === 'lobby' && isHost(room)) renderLobby(room);
    } catch (_) {}
  }
  async function sendGameInvite(targetId, button) {
    if (!room || !isHost(room)) return;
    try {
      button.disabled = true;
      await inviteApi({ action:'invite_send', userId:Core.me.id, roomId, targetId });
      const person = lobbyPeople.find((p) => p.id === targetId);
      Core.toast(`${person ? person.name : '사용자'}님에게 초대를 보냈습니다.`);
      button.textContent = '전송됨';
      setTimeout(() => { if (button.isConnected) { button.disabled = false; button.textContent = '초대'; } }, 30000);
    } catch (err) { Core.toast(err.message); button.disabled = false; }
  }
  function invitePanelHtml(r) {
    if (!isHost(r)) return '';
    const people = lobbyPeople.filter((p) => !r.players?.[p.id]);
    return `<section class="invite-panel"><div class="invite-panel-head"><b>메인 로비 접속자 초대</b><small>방장만 가능</small></div><div class="invite-people">${people.length ? people.map((p)=>`<div class="invite-person"><div class="avatar">${Core.esc(Core.initials(p.name))}</div><div class="person-info"><b>${Core.esc(p.name)}</b><small>${Core.esc(p.dept || '부서 미지정')}</small></div><button type="button" class="btn" data-invite-user="${Core.esc(p.id)}">초대</button></div>`).join('') : '<div class="invite-empty">현재 메인 로비에 초대 가능한 사용자가 없습니다.</div>'}</div></section>`;
  }
  function bindInviteButtons() { board.querySelectorAll('[data-invite-user]').forEach((b)=>b.addEventListener('click',()=>sendGameInvite(b.dataset.inviteUser,b))); }

  let sel = [];          // 선택한 카드 인덱스
  let taxSel = [];
  let taxScrollLeft = 0;
  let handScrollLeft = 0;
  let botTimer = null;
  let rankTimer = null;

  const JOKER = 13;      // 내부 표현: 13 = 비서(와일드)

  const CARD_NAME = {
    1: '회장', 2: '부회장', 3: '사장', 4: '전무', 5: '상무', 6: '이사',
    7: '부장', 8: '차장', 9: '과장', 10: '대리', 11: '주임', 12: '사원',
    13: '비서'
  };

  const seatedList = (r) => Object.values(r.players || {}).sort((a, b) => a.seat - b.seat);
  const isHost = (r) => r && r.host === Core.me.id;

  /* 계급 명칭 */
  function rankTitle(idx, total) {
    if (idx === 0) return { t: 'CEO', c: 'r-ceo' };
    if (idx === 1) return { t: '이사', c: 'r-exec' };
    if (idx === total - 1) return { t: '인턴', c: 'r-intern' };
    if (idx === total - 2) return { t: '수습', c: 'r-junior' };
    return { t: '사원 ' + idx, c: 'r-mid' };
  }

  /* ---------- 덱 ---------- */
  function buildDeck(seed) {
    const rng = Core.mulberry32(seed);
    const d = [];
    for (let v = 1; v <= 12; v++) for (let k = 0; k < v; k++) d.push(v);
    d.push(JOKER, JOKER);
    return Core.shuffle(d, rng);
  }

  function deal(r, deck) {
    const ps = seatedList(r);
    ps.forEach((p) => { p.hand = []; });
    deck.forEach((c, i) => { ps[i % ps.length].hand.push(c); });
    ps.forEach((p) => p.hand.sort((a, b) => a - b));
  }

  /* ---------- 첫 라운드 직급 카드 선택 ---------- */
  async function startGame() {
    await Core.updateRoom(roomId, (r) => {
      const ps = seatedList(r);
      if (ps.length < 4) return false;

      const rng = Core.mulberry32(r.seed);
      const values = Core.shuffle(Array.from({ length: ps.length }, (_, i) => i + 1), rng);
      r.phase = 'rank_draw';
      r.round = 1;
      r.rankDraw = values.map((value, index) => ({ index, value, takenBy: null }));
      r.rankChoices = {};
      r.rankRevealAt = 0;
      ps.forEach((p) => {
        p.ready = false;
        delete p.rank;
        delete p.hand;
      });
      r.pile = null;
      r.finishOrder = [];
      r.needTax = false;
    });
    Core.sys(roomId, '직급 카드 선택을 시작합니다. 원하는 카드를 선착순으로 고르세요.');
    Core.log(roomId, '<b>첫 라운드 직급 카드 선택</b>');
  }

  async function pickRankCard(index) {
    await Core.updateRoom(roomId, (r) => {
      if (r.phase !== 'rank_draw') return false;
      if (!r.rankChoices || Array.isArray(r.rankChoices)) r.rankChoices = {};
      (r.rankDraw || []).forEach((c) => {
        if (c.takenBy) r.rankChoices[c.takenBy] = c.index;
      });
      if (r.rankChoices[Core.me.id] != null) return false;
      const card = (r.rankDraw || []).find((c) => c.index === index);
      if (!card || card.takenBy) return false;
      card.takenBy = Core.me.id;
      r.rankChoices[Core.me.id] = index;
      if (Object.keys(r.rankChoices).length === seatedList(r).length) r.rankRevealAt = Core.now();
    });
  }

  function rankChoiceMap(r) {
    const out = (!r.rankChoices || Array.isArray(r.rankChoices))
      ? {}
      : { ...r.rankChoices };
    (r.rankDraw || []).forEach((c) => {
      if (c.takenBy) out[c.takenBy] = c.index;
    });
    return out;
  }

  async function finalizeRankDraw() {
    await Core.updateRoom(roomId, (r) => {
      if (r.phase !== 'rank_draw') return false;
      const ps = seatedList(r);
      const choices = rankChoiceMap(r);
      if (Object.keys(choices).length !== ps.length) return false;
      const values = {};
      (r.rankDraw || []).forEach((c) => { if (c.takenBy) values[c.takenBy] = c.value; });
      const order = ps.slice().sort((a, b) => values[a.id] - values[b.id]);
      order.forEach((p, i) => {
        p.rank = i;
        p.seat = i;
        p.done = false;
        p.passed = false;
        p.ready = false;
      });
      deal(r, buildDeck(r.seed + 1));
      r.phase = 'playing';
      r.pile = null;
      r.turn = 0;
      r.lead = 0;
      r.finishOrder = [];
      r.passCount = 0;
      r.trickRemaining = [];
      delete r.rankDraw;
      delete r.rankChoices;
      delete r.rankRevealAt;
    });
    Core.sys(roomId, '직급이 확정되었습니다. CEO부터 시작합니다.');
    Core.log(roomId, '<b>1라운드 시작</b> · CEO 선');
  }

  function maybeRankDraw(r) {
    clearTimeout(rankTimer);
    if (r.phase !== 'rank_draw') return;
    const ps = seatedList(r);
    const choices = rankChoiceMap(r);
    if (Object.keys(choices).length === ps.length) {
      const host = r.players && r.players[r.host];
      const finisher = host && !Core.isStale(host)
        ? host
        : ps.find((p) => !p.bot && !Core.isStale(p));
      if (!finisher || finisher.id !== Core.me.id) return;
      const wait = Math.max(300, 1800 - (Core.now() - (r.rankRevealAt || Core.now())));
      rankTimer = setTimeout(finalizeRankDraw, wait);
      return;
    }
    if (!isHost(r)) return;
    const bot = ps.find((p) => isAutoControlled(p) && choices[p.id] == null);
    if (bot) {
      rankTimer = setTimeout(() => Core.updateRoom(roomId, (rr) => {
        if (rr.phase !== 'rank_draw') return false;
        if (!rr.rankChoices || Array.isArray(rr.rankChoices)) rr.rankChoices = {};
        (rr.rankDraw || []).forEach((c) => {
          if (c.takenBy) rr.rankChoices[c.takenBy] = c.index;
        });
        if (rr.rankChoices[bot.id] != null) return false;
        const free = (rr.rankDraw || []).filter((c) => !c.takenBy);
        if (!free.length) return false;
        const card = free[Math.floor(Math.random() * free.length)];
        card.takenBy = bot.id;
        rr.rankChoices[bot.id] = card.index;
        if (Object.keys(rr.rankChoices).length === seatedList(rr).length) rr.rankRevealAt = Core.now();
      }), 700);
    }
  }

  function renderRankDraw(r) {

    const choices = rankChoiceMap(r);
    const mine = choices[Core.me.id];
    const allPicked = Object.keys(choices).length === ps.length;

    Core.actionAlert(roomId, mine == null && !allPicked ? `rank-draw:${r.round || 1}` : '',

        <div class="rank-draw-cards">

                ? `<span class="pick-no">${c.value}</span><small>${owner ? Core.esc(owner.name) : ''}</small>`
                : `<span class="pick-no">${c.takenBy ? '✓' : '?'}</span><small>${mineCard ? '내가 선택' : c.takenBy ? '선택 완료' : '카드 선택'}</small>`}
              </span>
            </button>`;
          }).join('')}
        </div>
        <div class="rank-draw-list">
          ${ps.map((p) => `<div><b>${Core.esc(p.name)}${p.id === Core.me.id ? ' · 나' : ''}</b>
            <small>${choices[p.id] != null ? (allPicked ? '카드 공개 완료' : '선택 완료') : '선택 대기 중'}</small></div>`).join('')}
        </div>
      </div>`;
    board.querySelectorAll('[data-rank-pick]').forEach((btn) => {
      btn.addEventListener('click', () => pickRankCard(Number(btn.dataset.rankPick)));

  /* ---------- 카드 내기 ---------- */
  async function playCards() {
    if (!sel.length) return;
    const me = room.players[Core.me.id];
    const cards = sel.map((i) => me.hand[i]);

    // 유효성: 조커 제외 모두 같은 숫자
    const nonJoker = cards.filter((c) => c !== JOKER);
    const val = nonJoker.length ? nonJoker[0] : JOKER;
    if (nonJoker.some((c) => c !== val)) {
      Core.toast('같은 숫자끼리만 낼 수 있습니다. (비서는 아무 숫자로나 사용)');
      return;
    }

    const pile = room.pile;
    if (pile) {
      if (cards.length !== pile.count) {
        Core.toast(`${pile.count}장을 내야 합니다.`);
        return;
      }
      if (val >= pile.value) {
        Core.toast('더 낮은 숫자를 내야 합니다.');
        return;
      }
    }

    let msg = null;
    await Core.updateRoom(roomId, (r) => {
      if (r.phase !== 'playing') return false;
      const ps = seatedList(r).filter((p) => !p.done);
      const cur = ps[r.turn % ps.length];
      if (!cur || cur.id !== Core.me.id) return false;

      const p = r.players[Core.me.id];
      const idxs = sel.slice().sort((a, b) => b - a);
      idxs.forEach((i) => p.hand.splice(i, 1));

      const wasNewTrick = !r.pile;
      r.pile = { value: val, count: cards.length, by: p.id, cards };
      p.passed = false;
      if (wasNewTrick) {
        const aliveNow = seatedList(r).filter((x) => !x.done && x.id !== p.id);
        const ordered = seatedList(r).filter((x) => !x.done);
        const start = ordered.findIndex((x) => x.id === p.id);
        r.trickRemaining = [];
        for (let step = 1; step < ordered.length; step++) {
          const q = ordered[(start + step) % ordered.length];
          if (q && q.id !== p.id) r.trickRemaining.push(q.id);
        }
      } else {
        r.trickRemaining = (r.trickRemaining || []).filter((id) => id !== p.id);
      }

      msg = `<b>${p.name}</b> 님이 ${CARD_NAME[val]}(${val === JOKER ? '와일드' : val}) ${cards.length}장`;

      if (p.hand.length === 0) {
        p.done = true;
        r.finishOrder = r.finishOrder || [];
        r.finishOrder.push(p.id);
        r.turn -= 1;
        msg += ' · <b>손패 소진</b>';
      }

      advance(r);
    });
    sel = [];
    if (msg) Core.log(roomId, msg);
  }

  /* ---------- 패스 ---------- */
  async function passTurn() {
    await Core.updateRoom(roomId, (r) => {
      if (r.phase !== 'playing' || !r.pile) return false;
      const alive = seatedList(r).filter((p) => !p.done);
      const cur = alive[r.turn % alive.length];
      if (!cur || cur.id !== Core.me.id) return false;
      cur.passed = true;
      r.trickRemaining = (r.trickRemaining || []).filter((id) => id !== cur.id);
      advance(r);
    });
    sel = [];
  }

  /* ---------- 턴 진행 ---------- */
  function advance(r) {
    const alive = seatedList(r).filter((p) => !p.done);

    if (alive.length <= 1) {
      if (alive.length === 1) {
        r.finishOrder = r.finishOrder || [];
        if (!r.finishOrder.includes(alive[0].id)) r.finishOrder.push(alive[0].id);
      }
      endRound(r);
      return;
    }

    // 한 묶음에서는 각 생존자가 한 번씩만 행동한다.
    // 남은 행동자가 없으면 마지막으로 카드를 낸 사람이 새 선을 잡는다.
    r.trickRemaining = (r.trickRemaining || []).filter((id) => alive.some((p) => p.id === id));
    if (r.pile && r.trickRemaining.length === 0) {
      const leaderId = r.pile.by;
      r.pile = null;
      alive.forEach((p) => { p.passed = false; });
      r.trickRemaining = [];
      let li = alive.findIndex((p) => p.id === leaderId);
      if (li < 0) {
        const all = seatedList(r);
        const old = all.findIndex((p) => p.id === leaderId);
        const next = alive.find((p) => p.seat > (old >= 0 ? all[old].seat : -1)) || alive[0];
        li = alive.findIndex((p) => p.id === next.id);
      }
      r.turn = Math.max(0, li);
      return;
    }

    // 아직 행동하지 않은 다음 플레이어에게만 턴을 준다.
    const nextId = (r.trickRemaining || [])[0];
    if (nextId) {
      const ni = alive.findIndex((p) => p.id === nextId);
      if (ni >= 0) {
        r.turn = ni;
        return;
      }
    }

    const idx = r.turn % alive.length;
    r.turn = (idx + 1) % alive.length;
  }

  /* ---------- 판 종료 → 계급 재배치 ---------- */
  function endRound(r) {
    const order = r.finishOrder || [];
    order.forEach((id, i) => {
      if (r.players[id]) {
        r.players[id].rank = i;
        r.players[id].seat = i;
      }
    });

    r.round = (r.round || 1) + 1;
    r.phase = 'tax';          // 다음 판 세금 단계
    r.pile = null;
    r.taxPaid = {};
    r.taxReturned = {};
    r.taxStage = 'deal';
    r.passCount = 0;
  }

  /* ---------- 세금 ---------- */
  function strongestCards(hand, count) {
    // 숫자가 낮을수록 강함. 비서(13)는 가장 약한 카드로 취급.
    return hand.slice().sort((a, b) => a - b).slice(0, count);
  }

  function removeCards(hand, cards) {
    cards.forEach((c) => {
      const i = hand.indexOf(c);
      if (i >= 0) hand.splice(i, 1);
    });
  }

  async function beginTaxExchange() {
    await Core.updateRoom(roomId, (r) => {
      if (r.phase !== 'tax' || r.taxStage !== 'deal') return false;
      const list = seatedList(r).sort((a, b) => a.rank - b.rank);
      const n = list.length;
      const deck = buildDeck(r.seed + r.round);
      list.forEach((p, i) => { p.rank = i; p.seat = i; p.hand = []; p.done = false; p.passed = false; });
      deck.forEach((c, i) => list[i % n].hand.push(c));
      list.forEach((p) => p.hand.sort((a, b) => a - b));

      const first = list[0], second = list[1];
      const secondLast = list[n - 2], last = list[n - 1];
      const lastGive = strongestCards(last.hand, 2);
      const secondLastGive = strongestCards(secondLast.hand, 1);
      removeCards(last.hand, lastGive);
      removeCards(secondLast.hand, secondLastGive);
      first.hand.push(...lastGive);
      second.hand.push(...secondLastGive);
      first.hand.sort((a, b) => a - b);
      second.hand.sort((a, b) => a - b);

      r.taxPaid = { [last.id]: lastGive, [secondLast.id]: secondLastGive };
      r.taxReturned = {};
      r.taxStage = 'return';
    });
    Core.log(roomId, '<b>세금 납부 완료</b> · 꼴등 2장, 끝에서 2등 1장');
  }

  async function returnTax() {
    const r = room;
    const ps = seatedList(r).sort((a, b) => a.rank - b.rank);
    const myRank = r.players[Core.me.id].rank;
    const need = myRank === 0 ? 2 : myRank === 1 ? 1 : 0;
    if (!need || r.taxStage !== 'return') return;
    if (taxSel.length !== need) {
      Core.toast(`${need}장을 골라 주세요.`);
      return;
    }

    await Core.updateRoom(roomId, (rr) => {
      if (rr.phase !== 'tax' || rr.taxStage !== 'return') return false;
      const p = rr.players[Core.me.id];
      if ((rr.taxReturned || {})[p.id]) return false;
      const cards = taxSel.map((i) => p.hand[i]).filter((c) => c != null);
      if (cards.length !== need) return false;
      const idxs = taxSel.slice().sort((a, b) => b - a);
      idxs.forEach((i) => p.hand.splice(i, 1));

      const list = seatedList(rr).sort((a, b) => a.rank - b.rank);
      const target = list[p.rank === 0 ? list.length - 1 : list.length - 2];
      target.hand.push(...cards);
      target.hand.sort((a, b) => a - b);
      rr.taxReturned = rr.taxReturned || {};
      rr.taxReturned[p.id] = cards;
      maybeFinishTax(rr);
    });
    taxSel = [];
    Core.log(roomId, `${Core.me.name} 님이 ${need}장을 돌려주었습니다`);
  }

  function maybeFinishTax(r) {
    const list = seatedList(r).sort((a, b) => a.rank - b.rank);
    const first = list[0], second = list[1];
    const returned = r.taxReturned || {};
    if (!returned[first.id] || !returned[second.id]) return;
    list.forEach((p) => { p.done = false; p.passed = false; });
    r.phase = 'playing';
    r.taxStage = '';
    r.pile = null;
    r.passCount = 0;
    r.trickRemaining = [];
    r.turn = 0;
    r.finishOrder = [];
  }

  function maybeTaxBots() {
    if (!room || room.phase !== 'tax' || room.taxStage !== 'return' || !isHost(room)) return;
    const list = seatedList(room).sort((a, b) => a.rank - b.rank);
    const targets = [list[0], list[1]].filter((p) => p && isAutoControlled(p) && !(room.taxReturned || {})[p.id]);
    if (!targets.length) return;
    clearTimeout(botTimer);
    botTimer = setTimeout(async () => {
      await Core.updateRoom(roomId, (r) => {
        if (r.phase !== 'tax' || r.taxStage !== 'return') return false;
        const ps = seatedList(r).sort((a, b) => a.rank - b.rank);
        for (const p of [ps[0], ps[1]]) {
          if (!p || !isAutoControlled(p) || (r.taxReturned || {})[p.id]) continue;
          const need = p.rank === 0 ? 2 : 1;
          // 봇은 받은 강한 카드를 보존하도록 가장 약한 카드부터 돌려줌
          const cards = p.hand.slice().sort((a, b) => b - a).slice(0, need);
          removeCards(p.hand, cards);
          const target = ps[p.rank === 0 ? ps.length - 1 : ps.length - 2];
          target.hand.push(...cards);
          target.hand.sort((a, b) => a - b);
          r.taxReturned = r.taxReturned || {};
          r.taxReturned[p.id] = cards;
        }
        maybeFinishTax(r);
      });
    }, 700);
  }

  /* ---------- 봇: 낼 카드 고르기 (조커를 와일드로 활용) ---------- */
  function pickBotPlay(hand, pile) {
    const groups = {};
    hand.forEach((c) => { groups[c] = (groups[c] || 0) + 1; });
    const jokers = groups[JOKER] || 0;
    const nums = Object.keys(groups).map(Number)
      .filter((k) => k !== JOKER).sort((a, b) => b - a);   // 약한(높은) 것부터

    const makeCards = (v, n) => {
      const have = Math.min(groups[v] || 0, n);
      const out = Array(have).fill(v);
      for (let k = have; k < n; k++) out.push(JOKER);
      return out;
    };

    if (!pile) {
      // 리드: 가장 많이 만들 수 있는 조합 중 가장 약한 숫자
      let best = null;
      nums.forEach((v) => {
        const n = groups[v] + jokers;
        if (!best || n > best.n || (n === best.n && v > best.v)) best = { v, n: groups[v] };
      });
      if (best) return { v: best.v, cards: makeCards(best.v, best.n) };
      // 손패가 조커뿐이면 조커를 1로 취급해 리드
      if (jokers) return { v: JOKER, cards: Array(jokers).fill(JOKER) };
      return null;
    }

    // 팔로우: 같은 장수의 더 낮은 숫자
    for (const v of nums) {
      if (v >= pile.value) continue;
      if (groups[v] + jokers >= pile.count) {
        return { v, cards: makeCards(v, pile.count) };
      }
    }
    // 조커만으로 대응 (가장 강한 1로 취급)
    if (jokers >= pile.count && pile.value > 1) {
      return { v: 1, cards: Array(pile.count).fill(JOKER) };
    }
    return null;
  }

  /* ---------- 봇 ---------- */
  function maybeBot() {
    clearTimeout(botTimer);
    if (!room || room.phase !== 'playing' || !isHost(room)) return;
    const alive = seatedList(room).filter((p) => !p.done);
    const cur = alive[room.turn % alive.length];
    if (!cur || !isAutoControlled(cur)) return;

    botTimer = setTimeout(async () => {
      await Core.updateRoom(roomId, (r) => {
        if (r.phase !== 'playing') return false;
        const al = seatedList(r).filter((p) => !p.done);
        const b = al[r.turn % al.length];
        if (!b || !isAutoControlled(b)) return false;

        const play = pickBotPlay(b.hand, r.pile);

        if (!play) {
          b.passed = true;
          r.trickRemaining = (r.trickRemaining || []).filter((id) => id !== b.id);
        } else {
          play.cards.forEach((c) => {
            const i = b.hand.indexOf(c);
            if (i >= 0) b.hand.splice(i, 1);
          });
          const wasNewTrick = !r.pile;
          r.pile = { value: play.v, count: play.cards.length, by: b.id, cards: play.cards };
          b.passed = false;
          if (wasNewTrick) {
            const ordered = seatedList(r).filter((x) => !x.done);
            const start = ordered.findIndex((x) => x.id === b.id);
            r.trickRemaining = [];
            for (let step = 1; step < ordered.length; step++) {
              const q = ordered[(start + step) % ordered.length];
              if (q && q.id !== b.id) r.trickRemaining.push(q.id);
            }
          } else {
            r.trickRemaining = (r.trickRemaining || []).filter((id) => id !== b.id);
          }
          if (b.hand.length === 0) {
            b.done = true;
            r.finishOrder = r.finishOrder || [];
            r.finishOrder.push(b.id);
            r.turn -= 1;
          }
        }
        advance(r);
      });
    }, 850);
  }

  async function addBot() {
    await Core.updateRoom(roomId, (r) => {
      const ps = seatedList(r);
      if (ps.length >= r.maxSeats) return false;
      const id = 'bot_' + Core.uid(6);
      const names = Core.BOT_TITLES;
      r.players[id] = {
        id, bot: true,
        name: names[ps.filter((p) => p.bot).length % names.length],
        dept: '자동', seat: ps.length,
        ready: true, online: true, beat: Core.now()
      };
    });
  }

  /* ---------- 렌더: 로비 ---------- */
  function renderLobby(r) {
    const ps = seatedList(r);
    const ready = ps.filter((p) => p.ready).length;
    const canStart = ps.length >= 4 && ready === ps.length;

    board.innerHTML = `

        <div class="lobby-players">
          ${ps.map((p) => `

              ${p.id === r.host ? '<span class="badge host">개설자</span>' : ''}
              ${p.ready ? '<span class="badge ready">준비</span>' : '<span class="badge">대기</span>'}
              ${(isHost(r) && p.id !== r.host) ? `<button class="lobby-remove" data-kick="${p.id}" data-kick-name="${Core.esc(p.name)}" title="참가자 내보내기" aria-label="${Core.esc(p.name)} 내보내기">×</button>` : ''}
            </div>`).join('')}
          ${Array.from({ length: Math.max(0, 4 - ps.length) }).map(() => `
            <div class="lobby-row" style="opacity:.4">
              <div class="avatar" style="background:var(--ink-3);color:var(--cream-dim)">·</div>
              <div style="flex:1" class="muted">빈 자리</div>
            </div>`).join('')}
        </div>

        <div class="lobby-actions">
          <button class="btn ${r.players[Core.me.id]?.ready ? '' : 'btn-primary'}" id="btnReady">
            ${r.players[Core.me.id]?.ready ? '준비 취소' : '준비 완료'}
          </button>
          <button class="btn btn-ghost" id="btnCopyInvite" type="button">🔗 초대 링크 복사</button>
          ${isHost(r) ? `<button class="btn btn-bot" id="btnBot" ${ps.length >= r.maxSeats ? 'disabled' : ''}>봇 추가 · 유료</button>` : ''}
          ${isHost(r) ? `<button class="btn btn-primary" id="btnStart" ${canStart ? '' : 'disabled'}>
            세션 시작 ${ps.length < 4 ? '(4명 필요)' : `(${ready}/${ps.length})`}</button>` : ''}
        </div>

        ${invitePanelHtml(r)}


      </div>`;

    bindInviteButtons();
    const rb = document.getElementById('btnReady');
    rb && rb.addEventListener('click', () => {
      Core.updateRoom(roomId, (rr) => {
        const p = rr.players[Core.me.id];
        if (p) p.ready = !p.ready;
      });
    });
    const bb = document.getElementById('btnBot');
    bb && bb.addEventListener('click', async () => {
      if (await Core.requestBotAccess()) addBot();
    });
    document.getElementById('btnCopyInvite')?.addEventListener('click', () => Core.copyInviteLink(roomId));
    const sb = document.getElementById('btnStart');
    sb && sb.addEventListener('click', startGame);
    board.querySelectorAll('[data-kick]').forEach((b) => {
      b.addEventListener('click', () => {
        const targetName = b.dataset.kickName || '이 참가자';
        if (!window.confirm(`${targetName}님을 이 방에서 강퇴하시겠습니까?`)) return;
        Core.updateRoom(roomId, (rr) => {
          if (!rr || rr.host !== Core.me.id || b.dataset.kick === rr.host) return;
          delete rr.players[b.dataset.kick];
          seatedList(rr).forEach((p, i) => { p.seat = i; });
        });
      });
    });
  }

  /* ---------- 카드 HTML ---------- */
  function cardHTML(v, extra) {
    if (v === JOKER) {
      return `<div class="lcard joker ${extra || ''}">
        <span class="cr">★</span><span class="rk">비서</span><span class="lb">아무 숫자로</span></div>`;
    }
    return `<div class="lcard ${extra || ''}">
      <span class="cr">${v}</span><span class="rk">${v}</span>
      <span class="lb">${CARD_NAME[v]}</span></div>`;
  }

  /* ---------- 렌더: 게임 ---------- */
  function renderGame(r) {
    const previousHand = document.getElementById('handEl');
    if (previousHand) handScrollLeft = previousHand.scrollLeft;
    const ps = seatedList(r).slice().sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
    const alive = seatedList(r).filter((p) => !p.done);
    const cur = alive[r.turn % alive.length];
    const myTurn = cur && cur.id === Core.me.id;
    const activeOrder = alive.filter((p) => !p.passed || p.id === cur?.id);
    const curOrderIndex = Math.max(0, activeOrder.findIndex((p) => p.id === cur?.id));
    const prevTurn = activeOrder.length > 1 ? activeOrder[(curOrderIndex - 1 + activeOrder.length) % activeOrder.length] : cur;
    const nextTurn = activeOrder.length > 1 ? activeOrder[(curOrderIndex + 1) % activeOrder.length] : cur;
    const me = r.players[Core.me.id];
    const n = ps.length;

    const myRankInfo = rankTitle(me.rank ?? 0, n);
    const pile = r.pile;
    Core.actionAlert(roomId, myTurn ? `turn:${cur.id}` : '',
      '내 작업 차례입니다.');

    board.innerHTML = `
      <div class="ladder-stage">
        <div class="turn-sequence" aria-label="차례 순서">
          <div><span>이전 차례</span><b>${prevTurn ? Core.esc(prevTurn.name) : '—'}</b></div>
          <div class="current"><span>${myTurn ? '내 차례' : '현재 차례'}</span><b>${cur ? Core.esc(cur.name) : '—'}</b></div>
          <div><span>다음 차례</span><b>${nextTurn ? Core.esc(nextTurn.name) : '—'}</b></div>
        </div>
        <div class="round-status">
          <span class="status-label">${pile ? '직전 행동' : '새 선'}</span>
          ${pile
            ? `<span><b>${Core.esc((r.players[pile.by] || {}).name || '')}</b> 님이
                <b>${pile.value === JOKER ? '비서' : pile.value + '번'} ${pile.count}장</b>을 냈습니다.</span>
               <small>다음 차례: <b>${cur ? Core.esc(cur.name) : ''}</b> · ${pile.value === JOKER ? '비서보다 강한' : pile.value + '보다 낮은'} 숫자 ${pile.count}장</small>`
            : `<span><b>${cur ? Core.esc(cur.name) : ''}</b> 님이 선입니다.</span>
               <small>원하는 숫자와 장수로 시작</small>`}
        </div>

        <div class="rank-row">
          ${ps.map((p, i) => {
            const rt = rankTitle(p.rank ?? i, n);
            const stale = !p.bot && Core.isStale(p);
            return `
              <div class="rank-card ${cur && cur.id === p.id ? 'active' : ''} ${p.done ? 'out' : ''}">
                <div class="title ${rt.c}">${rt.t}</div>
                <div class="nm">${Core.esc(p.name)}${p.id === Core.me.id ? ' ·나' : ''}</div>
                <div class="cnt">카드 ${p.hand ? p.hand.length : 0}장</div>
                ${p.done ? '<div class="passed" style="color:var(--green)">완료</div>' : ''}
                ${p.passed && !p.done ? '<div class="passed">패스</div>' : ''}
                ${stale ? '<div class="passed">접속 끊김</div>' : ''}
                ${pile && pile.by === p.id
                  ? `<div class="lead-mark">선 · ${pile.value === JOKER ? '비서' : pile.value} × ${pile.count}</div>`
                  : (!pile && cur && cur.id === p.id ? '<div class="lead-mark">새 선</div>' : '')}
              </div>`;
          }).join('')}
        </div>

        <div class="play-area">
          ${pile ? `
            <div style="text-align:center">
              <div class="pile">${pile.cards.map((c) => cardHTML(c)).join('')}</div>
              <div class="mono muted" style="font-size:11.5px;margin-top:14px">
                ${Core.esc((r.players[pile.by] || {}).name || '')} 님 ·
                ${CARD_NAME[pile.value]} ${pile.count}장
              </div>
            </div>`
            : `<div class="pile-empty">비어 있습니다<br>
                 <span style="color:var(--brass)">${cur ? Core.esc(cur.name) : ''} 님이 시작합니다</span>
               </div>`}
        </div>

        <div class="hand-wrap">
          <div class="hand-head">
            <span class="my-rank ${myRankInfo.c}">${myRankInfo.t}</span>
            <span class="turn-note">
              ${myTurn
                ? (pile ? `${CARD_NAME[pile.value]}보다 낮은 숫자 ${pile.count}장을 내세요`
                        : '원하는 숫자를 원하는 장수만큼 내세요')
                : `${cur ? Core.esc(cur.name) + ' 님 차례' : ''}`}
            </span>
            <span style="flex:1"></span>
            <span class="mono muted" style="font-size:11.5px">${r.round}라운드</span>
          </div>

          <div class="hand" id="handEl">
            ${(me.hand || []).map((c, i) => {
              const playable = myTurn && (!pile || c < pile.value || c === JOKER);
              return cardHTML(c, `${sel.includes(i) ? 'sel' : ''} ${playable ? '' : 'dim'}`)
                .replace('<div class="lcard', `<div data-i="${i}" class="lcard`);
            }).join('')}
          </div>

          <div class="hand-actions">
            <button class="btn btn-primary" id="btnPlay" ${myTurn && sel.length ? '' : 'disabled'}>
              내기 ${sel.length ? `(${sel.length}장)` : ''}
            </button>
            <button class="btn" id="btnPass" ${myTurn && pile ? '' : 'disabled'}>패스</button>
            <button class="btn btn-ghost btn-sm" id="btnClear" ${sel.length ? '' : 'disabled'}>선택 해제</button>
          </div>
        </div>
      </div>`;

    const handEl = document.getElementById('handEl');
    if (handEl) {
      requestAnimationFrame(() => {
        const max = Math.max(0, handEl.scrollWidth - handEl.clientWidth);
        handEl.scrollLeft = Math.min(handScrollLeft, max);
      });
      handEl.addEventListener('scroll', () => { handScrollLeft = handEl.scrollLeft; }, { passive: true });
      handEl.addEventListener('wheel', (e) => {
        if (handEl.scrollWidth <= handEl.clientWidth) return;
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (!delta) return;
        e.preventDefault();
        handEl.scrollLeft += delta;
        handScrollLeft = handEl.scrollLeft;
      }, { passive: false });
    }
    handEl && handEl.addEventListener('click', (e) => {
      const c = e.target.closest('[data-i]');
      if (!c || !myTurn) return;
      const i = Number(c.dataset.i);
      const v = me.hand[i];
      if (pile && v >= pile.value && v !== JOKER) {
        Core.toast('더 낮은 숫자를 내야 합니다.');
        return;
      }
      handScrollLeft = handEl.scrollLeft;
      const at = sel.indexOf(i);
      if (at >= 0) sel.splice(at, 1);
      else sel.push(i);
      renderGame(room);
    });

    const pb = document.getElementById('btnPlay');
    pb && pb.addEventListener('click', playCards);
    const sb = document.getElementById('btnPass');
    sb && sb.addEventListener('click', passTurn);
    const cb = document.getElementById('btnClear');
    cb && cb.addEventListener('click', () => { if (handEl) handScrollLeft = handEl.scrollLeft; sel = []; renderGame(room); });
  }

  /* ---------- 렌더: 세금 ---------- */
  function renderTax(r) {
    const previousTaxHand = document.getElementById('taxHand');
    if (previousTaxHand) taxScrollLeft = previousTaxHand.scrollLeft;
    const ps = seatedList(r).sort((a, b) => a.rank - b.rank);
    const n = ps.length;
    const me = r.players[Core.me.id];
    const myRank = me.rank;
    const need = myRank === 0 ? 2 : myRank === 1 ? 1 : 0;
    const returned = !!(r.taxReturned || {})[me.id];

    Core.actionAlert(roomId,
      r.taxStage === 'deal' && isHost(r) ? `round-ready:${r.round}` :
      r.taxStage === 'return' && need && !returned ? `tax-return:${r.round}` : '',
      r.taxStage === 'return' && need ? `${need}장을 골라 돌려주세요.` : '다음 라운드를 준비해 주세요.');

    const selectionPanel = r.taxStage === 'return' && need && !returned ? `
      <div class="hand-wrap" style="margin-top:18px">
        <div class="hand-head">
          <span class="my-rank ${rankTitle(myRank, n).c}">${rankTitle(myRank, n).t}</span>
          <span class="turn-note">받은 카드를 포함한 손패에서 돌려줄 ${need}장을 선택하세요.</span>
        </div>
        <div class="hand" id="taxHand">
          ${(me.hand || []).map((c, i) => cardHTML(c, taxSel.includes(i) ? 'sel' : '')
            .replace('<div class="lcard', `<div data-tax-i="${i}" class="lcard`)).join('')}
        </div>
        <div class="hand-actions">
          <button class="btn btn-primary" id="btnReturnTax" ${taxSel.length === need ? '' : 'disabled'}>
            ${need}장 돌려주기 ${taxSel.length ? `(${taxSel.length}/${need})` : ''}
          </button>
          <button class="btn btn-ghost btn-sm" id="btnTaxClear" ${taxSel.length ? '' : 'disabled'}>선택 해제</button>
        </div>
      </div>` : '';

    board.innerHTML = `
      <div class="tax-panel">
        <div class="eyebrow">${r.round}라운드 준비</div>
        <h3>계급 세금 교환</h3>
        <p class="muted" style="font-size:13.5px;line-height:1.7">
          꼴등은 가장 강한 카드 2장을 1등에게, 끝에서 2등은 가장 강한 카드 1장을 2등에게 줍니다.<br>
          받은 뒤 1등은 원하는 카드 2장, 2등은 원하는 카드 1장을 각각 돌려줍니다.
        </p>

        <div class="lobby-players" style="margin:18px 0">
          ${ps.map((p, i) => {
            const rt = rankTitle(i, n);
            const state = r.taxStage === 'return' && (i === 0 || i === 1)
              ? ((r.taxReturned || {})[p.id] ? '교환 완료' : `${i === 0 ? 2 : 1}장 선택 중`)
              : (r.taxStage === 'return' && (i === n - 1 || i === n - 2) ? '세금 납부 완료' : '대기');
            return `<div class="lobby-row">
              <div class="avatar">${Core.esc(Core.initials(p.name))}</div>
              <div style="flex:1">
                <div style="font-weight:500">${Core.esc(p.name)}</div>
                <div class="mono ${rt.c}" style="font-size:11px">${rt.t} · ${state}</div>
              </div>
            </div>`;
          }).join('')}
        </div>

        ${r.taxStage === 'deal'
          ? (isHost(r)
            ? '<button class="btn btn-primary btn-block" id="btnBeginTax">카드 배분 및 세금 교환 시작</button>'
            : '<div class="muted mono" style="font-size:12.5px;text-align:center">개설자가 카드를 배분하기를 기다리는 중…</div>')
          : selectionPanel || '<div class="muted mono" style="font-size:12.5px;text-align:center">1등과 2등의 카드 선택을 기다리는 중…</div>'}
      </div>`;

    const begin = document.getElementById('btnBeginTax');
    begin && begin.addEventListener('click', beginTaxExchange);

    const hand = document.getElementById('taxHand');
    if (hand) {
      requestAnimationFrame(() => { hand.scrollLeft = taxScrollLeft; });
      hand.addEventListener('scroll', () => { taxScrollLeft = hand.scrollLeft; }, { passive: true });
      hand.addEventListener('wheel', (e) => {
        if (hand.scrollWidth <= hand.clientWidth) return;
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (!delta) return;
        e.preventDefault();
        hand.scrollLeft += delta;
        taxScrollLeft = hand.scrollLeft;
      }, { passive: false });
      hand.addEventListener('click', (e) => {
        const card = e.target.closest('[data-tax-i]');
        if (!card) return;
        taxScrollLeft = hand.scrollLeft;
        const i = Number(card.dataset.taxI);
        const at = taxSel.indexOf(i);
        if (at >= 0) taxSel.splice(at, 1);
        else if (taxSel.length < need) taxSel.push(i);
        else Core.toast(`${need}장만 선택할 수 있습니다.`);
        renderTax(room);
      });
    }
    const ret = document.getElementById('btnReturnTax');
    ret && ret.addEventListener('click', returnTax);
    const clear = document.getElementById('btnTaxClear');
    clear && clear.addEventListener('click', () => { taxSel = []; renderTax(room); });

    maybeTaxBots();
  }

  /* ---------- 구독 ---------- */
  Core.onRoom(roomId, (r) => {
    if (!r) {
      board.innerHTML = '<div class="empty-state">자료실이 사라졌습니다. ' +
        '<a href="index.html" style="color:var(--brass)">목록으로</a></div>';
      return;
    }
    if (!r.players || !r.players[Core.me.id]) {
      board.innerHTML = '<div class="empty-state">이 자료실에서 나간 상태입니다. ' +
        '<a href="index.html" style="color:var(--brass)">목록으로</a></div>';
      return;
    }
    room = r;
    paintAiAssist(r);
    document.body.dataset.gamePhase = r.phase || 'lobby';
    if (r.phase === 'lobby') renderLobby(r);
    else if (r.phase === 'rank_draw') renderRankDraw(r);
    else if (r.phase === 'tax') renderTax(r);
    else { renderGame(r); maybeBot(); }
  });

  window.addEventListener('pagehide', () => Core.stopHeartbeat());
  document.addEventListener('click', (e) => {
    if (e.target.closest('a[href="index.html"]')) {
      sessionStorage.setItem('table9:suppressRejoinOnce', '1');
    }
  });
  document.querySelector('[data-leave]').addEventListener('click', async () => {
    if (room && room.phase === 'playing') {
      if (!confirm('세션이 진행 중입니다. 나가시겠습니까?')) return;
    }
    await Core.leaveRoom(roomId).catch(() => {});
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>
